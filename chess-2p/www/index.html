<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#312e2b">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Pass &amp; Play Chess</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span><span>Pass &amp; Play</span></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-pause" title="Pause clocks" hidden></button>
        <button class="icon-btn" id="btn-settings" title="Settings"></button>
      </div>
    </header>

    <main class="stage">
      <div class="board-col">
        <section class="player" id="bar-top"></section>
        <div class="board-wrap" id="board-wrap">
          <div class="board" id="board"></div>
          <div class="board-overlay" id="pause-overlay" hidden>
            <div class="pause-card">
              <div class="pause-title">Game paused</div>
              <button class="btn btn-primary" id="btn-resume">Resume</button>
            </div>
          </div>
        </div>
        <section class="player" id="bar-bottom"></section>
      </div>

      <aside class="side">
        <div class="moves" id="moves"></div>
        <nav class="toolbar">
          <button class="tool" id="btn-new"><span class="ti"></span><span>New</span></button>
          <button class="tool" id="btn-undo"><span class="ti"></span><span>Undo</span></button>
          <button class="tool" id="btn-end"><span class="ti"></span><span>Draw / Resign</span></button>
          <button class="tool" id="btn-flip"><span class="ti"></span><span>Flip</span></button>
          <button class="tool" id="btn-prev"><span class="ti"></span><span>Back</span></button>
          <button class="tool" id="btn-next"><span class="ti"></span><span>Next</span></button>
        </nav>
      </aside>
    </main>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" hidden></div>
  <input type="file" id="photo-input" accept="image/*" hidden>

  <script src="js/pieces.js"></script>
  <script src="js/chess.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
