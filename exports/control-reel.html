:root { --bg:#050506; --fg:#e9e9ef; --muted:#8a8a98; --line:#22222a; --accent:#7c5cff; }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font: 13px/1.4 "Mono", ui-monospace, monospace; }
body { min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:12px; padding:16px; }
canvas#c { display:block; width:min(calc(100vw - 32px), calc((100vh - 150px) * 0.5625)); height:auto; aspect-ratio:9/16; background:#000; border-radius:10px; box-shadow:0 0 0 1px var(--line); }
.bar { width:min(calc(100vw - 32px), 640px); display:flex; flex-direction:column; gap:8px; }
.row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
button { background:#111116; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 12px; font:inherit; cursor:pointer; }
button:hover { border-color:#3a3a46; }
#time { font-variant-numeric:tabular-nums; color:var(--muted); min-width:120px; }
input[type=range] { flex:1; min-width:160px; accent-color:var(--accent); }
.beats { display:flex; height:22px; border-radius:6px; overflow:hidden; border:1px solid var(--line); position:relative; }
.beats div { border-right:1px solid var(--line); color:var(--muted); font-size:10px; display:flex; align-items:center; justify-content:center; white-space:nowrap; overflow:hidden; cursor:pointer; }
.beats div:last-child { border-right:0; }
.beats i { position:absolute; top:0; bottom:0; width:1px; background:rgba(124,92,255,.55); pointer-events:none; }
label { color:var(--muted); display:flex; gap:6px; align-items:center; }
</style>

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="bar">
  <div class="row">
    <button id="play">Play</button>
    <button id="prev" title="Previous frame (←)">◀︎</button>
    <button id="next" title="Next frame (→)">▶︎</button>
    <span id="time">00.00 / 20.00</span>
    <label><input type="checkbox" id="mb"> motion blur</label>
  </div>
  <input type="range" id="scrub" min="0" max="599" value="0" step="1">
  <div class="beats" id="beats"></div>
</div>
<script>
"use strict";

const FPS = CONFIG.fps, DUR = CONFIG.duration, FRAMES = Math.round(FPS * DUR);
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const mk = () => { const k = document.createElement("canvas"); k.width = W; k.height = H; return k; };
const work = mk(), wctx = work.getContext("2d");
const layerA = mk(), lA = layerA.getContext("2d");
const frost = mk(), fr = frost.getContext("2d");

/* ======================= COMPOSITE ======================= */
function render(c, t) {
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = "source-over"; c.filter = "none"; c.shadowBlur = 0;

  if (t < 2.2) sHook(c, t);
  else if (t < 2.62) {   // shockwave from the LED wipes beat 1 away
    const s = hookCam(t), ox = CX + (LED[0] - CX) * s, oy = 800 + (LED[1] - 800) * s, R = (1 - Math.pow(1 - prog(t, 2.2, 2.62), 2)) * 1800;
    c.save(); c.beginPath(); c.rect(0, 0, W, H); c.arc(ox, oy, R, 0, Math.PI * 2, true); c.clip("evenodd"); sHook(c, t); c.restore();
    c.save(); c.beginPath(); c.arc(ox, oy, R, 0, Math.PI * 2); c.clip(); c.fillStyle = "#000"; c.fillRect(0, 0, W, H); sProblem(c, t); c.restore();
    shock(c, ox, oy, R, 170, accentAt(t), 1 - prog(t, 2.45, 2.62));
  }
  else if (t < 6.0) sProblem(c, t);
  else if (t < 6.42) {   // the light line splits open onto beat 3
    const d = E.outExpo(prog(t, 6.0, 6.42)) * 620, ac = accentAt(t);
    c.save(); c.beginPath(); c.rect(CX - d, 0, d * 2, H); c.clip(); sSolution(c, t); c.restore();
    const la = 1 - prog(t, 6.05, 6.42);
    c.save(); c.globalCompositeOperation = "lighter";
    for (const x of [CX - d, CX + d]) { const g = c.createLinearGradient(x - 40, 0, x + 40, 0); g.addColorStop(0, css(ac, 0)); g.addColorStop(.5, css(ac, .8 * la)); g.addColorStop(1, css(ac, 0));
      c.fillStyle = g; c.fillRect(x - 40, 0, 80, H); c.fillStyle = `rgba(255,255,255,${la})`; c.fillRect(x - 1.5, 0, 3, H); }
    c.restore();
  }
  else if (t < 10.0) sSolution(c, t);
  else if (t < 13.5) { const { G, K } = sStat(c, t); if (t >= 13.0) statAperture(c, t, G, K); }
  else if (t < 17.0) sBenefit(c, t);
  else sEnd(c, t);
}

/* Frame render with optional shutter accumulation (motion blur). Never blends across the hard cut at 10.0 s. */
function renderFrame(f, samples = 1) {
  const t = f / FPS;
  if (samples <= 1) { render(ctx, t); return; }
  for (let k = 0; k < samples; k++) {
    let tk = (f - (k / samples) * CONFIG.shutter) / FPS; if (t >= 10 && tk < 10) tk = 10;
    render(wctx, Math.max(0, tk));
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1 / (k + 1); ctx.drawImage(work, 0, 0);
  }
  ctx.globalAlpha = 1;
}

/* ======================= PLAYER ======================= */
const ready = (async () => {
  await Promise.all(["IDBlack", "IDBold", "IDLight", "ISerif", "Mono"].map(f => document.fonts.load(`40px ${f}`)));
  await document.fonts.ready; measureCounter();
})();
window.REEL = { ready, renderFrame, canvas: cv, FRAMES, FPS, CONFIG };

const $ = id => document.getElementById(id), scrub = $("scrub"), timeEl = $("time"), playBtn = $("play"), mb = $("mb");
scrub.max = FRAMES - 1;
let frame = 0, playing = false, t0 = 0, f0 = 0;
const show = f => { frame = Math.max(0, Math.min(FRAMES - 1, f)); renderFrame(frame, mb.checked ? 4 : 1); scrub.value = frame;
  timeEl.textContent = `${(frame / FPS).toFixed(2).padStart(5, "0")} / ${DUR.toFixed(2)}  f${frame}`; };
const loop = now => { if (!playing) return; const f = f0 + Math.floor((now - t0) / 1000 * FPS); show(f % FRAMES); requestAnimationFrame(loop); };
const toggle = () => { playing = !playing; playBtn.textContent = playing ? "Pause" : "Play"; if (playing) { t0 = performance.now(); f0 = frame; requestAnimationFrame(loop); } };
playBtn.onclick = toggle; $("prev").onclick = () => show(frame - 1); $("next").onclick = () => show(frame + 1);
scrub.oninput = () => { playing = false; playBtn.textContent = "Play"; show(+scrub.value); };
mb.onchange = () => show(frame);
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); toggle(); } if (e.key === "ArrowLeft") show(frame - 1); if (e.key === "ArrowRight") show(frame + 1); });
const bx = $("beats");
BEATS.forEach(b => { const d = document.createElement("div"); d.style.width = ((b.end - b.start) / DUR * 100) + "%"; d.textContent = b.name; d.onclick = () => show(Math.round(b.start * FPS)); bx.appendChild(d); });
CUES.forEach(q => { const i = document.createElement("i"); i.style.left = (q.t / DUR * 100) + "%"; i.title = `${q.t.toFixed(2)}s — ${q.sfx}`; bx.appendChild(i); });
ready.then(() => { if (!window.__EXPORT__) show(0); });
</script>
