<script>

<style>

<script>
"use strict";
const W_ = 1080, H_ = 1920, CX = 540, CY = 960;
const FPS = CONFIG.fps, DUR = CONFIG.duration, FRAMES = Math.round(FPS * DUR);
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const mk = () => { const k = document.createElement("canvas"); k.width = W_; k.height = H_; return k; };

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));

const prog = (t, a, b) => clamp((t - a) / (b - a));

const COL = Object.fromEntries(Object.entries(CONFIG.color).map(([k, v]) => [k, hex(v)]));

/* ---------- voice timing ---------- */
const VO = Object.fromEntries(VO_META.map(v => [v.id, v]));

  const tot = wt.reduce((a, b) => a + b, 0); let cum = 0; for (let i = 0; i < Math.min(n, words.length); i++) cum += wt[i]; return v.t + v.dur * (.04 + .9 * cum / tot); }

/* ---------- sprites ---------- */
const IMG = {};
const loadSprites = () => Promise.all(Object.entries(SPR).map(([k, src]) => new Promise(r => { const im = new Image(); im.onload = () => { IMG[k] = im; r(); }; im.src = src; })));
function plate(c, name, x, y, w, { alpha = 1, anchor = "center" } = {}) {   // draw a plate by width, anchored at centre or bottom
  const im = IMG[name]; if (!im || alpha <= .002) return; const h = im.height * w / im.width;
  c.save(); c.globalAlpha *= alpha; c.drawImage(im, x - w / 2, anchor === "bottom" ? y - h : y - h / 2, w, h); c.restore();
}
function cover(c, name, { alpha = 1, s = 1, dx = 0, dy = 0 } = {}) {   // fill the frame, with camera scale/offset
  const im = IMG[name]; if (!im) return; const k = Math.max(W_ / im.width, H_ / im.height) * s, w = im.width * k, h = im.height * k;

}

/* ---------- paper world ---------- */
const PAPER = mk();
(() => { const g = PAPER.getContext("2d");
  const rg = g.createRadialGradient(CX, 860, 200, CX, 900, 1250); rg.addColorStop(0, CONFIG.color.paper); rg.addColorStop(1, CONFIG.color.paperEdge);

  for (let i = 0; i < 26; i++) { const x = hash(i * 3.1) * W_, y = hash(i * 7.7) * H_, r = 6 + hash(i * 1.3) * 40, gg = g.createRadialGradient(x, y, 0, x, y, r);
    gg.addColorStop(0, "rgba(150,110,60,.10)"); gg.addColorStop(1, "rgba(150,110,60,0)"); g.fillStyle = gg; g.fillRect(x - r, y - r, r * 2, r * 2); }
})();
const paper = c => c.drawImage(PAPER, 0, 0);
const GRAIN = document.createElement("canvas"); GRAIN.width = 540; GRAIN.height = 960;
(() => { const g = GRAIN.getContext("2d"), d = g.createImageData(540, 960); for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (hash(i * .61) - .5) * 200; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); })();
function finish(c, f) {
  c.save(); c.globalCompositeOperation = "overlay"; c.globalAlpha = .09; const ox = hash(f) * 180 | 0, oy = hash(f + 3) * 300 | 0; c.drawImage(GRAIN, -ox, -oy, W_ + 180, H_ + 300); c.restore();
  c.save(); for (let i = 0; i < 5; i++) { const k = f * 7 + i; if (hash(k) > .55) continue; c.fillStyle = `rgba(40,28,18,${.15 + hash(k + 1) * .25})`; c.beginPath(); c.arc(hash(k + 2) * W_, hash(k + 3) * H_, .8 + hash(k + 4) * 1.8, 0, 7); c.fill(); } c.restore();
  const v = c.createRadialGradient(CX, 900, 560, CX, 960, 1250); v.addColorStop(0, "rgba(40,24,10,0)"); v.addColorStop(1, "rgba(40,24,10,.38)"); c.fillStyle = v; c.fillRect(0, 0, W_, H_);
}

/* ---------- type ---------- */
function strip(c, t, { at, s, x, y, size = 50, align = "left" }) {   // the teal editorial label
  if (t < at) return; const p = E.outExpo(prog(t, at, at + .45));
  c.save(); c.font = `${size}px ISI`; const tw = c.measureText(s).width, padX = size * .32, padY = size * .2, w = tw + padX * 2, h = size * 1.05;
  const x0 = align === "center" ? x - w / 2 : align === "right" ? x - w : x, y0 = y - h + padY;
  c.beginPath(); const jit = i => (hash(i + at * 13) - .5) * 3;
  c.moveTo(x0 + jit(1), y0 + jit(2)); c.lineTo(x0 + w * p + jit(3), y0 + jit(4)); c.lineTo(x0 + w * p + jit(5), y0 + h + jit(6)); c.lineTo(x0 + jit(7), y0 + h + jit(8)); c.closePath();
  c.fillStyle = css(COL.teal, .93); c.fill(); c.clip();
  c.fillStyle = css(COL.cream); c.textBaseline = "alphabetic"; c.fillText(s, x0 + padX, y0 + h - padY * 1.45);
  c.restore();
}
function ink(c, t, { at, s, x = CX, y, size = 64, align = "center", color = COL.ink, alpha = 1, fam = "ISI" }) {   // quiet serif annotation
  if (t < at) return; const p = E.out(prog(t, at, at + .7));
  c.save(); c.globalAlpha *= p * alpha; c.font = `${size}px ${fam}`; c.textAlign = align; c.fillStyle = css(color);
  if (p < 1) c.filter = `blur(${(1 - p) * 3}px)`; c.fillText(s, x, y + (1 - p) * 10); c.restore();

    c.moveTo(-8, sh[1] - 6); c.lineTo(-12, sh[1] + 4); c.lineTo(-10, hip[1] + 4); c.lineTo(-13, hip[1] + 16); c.lineTo(10, hip[1] + 10); c.lineTo(11, sh[1] + 2); c.lineTo(7, sh[1] - 6); c.closePath(); c.fill();
  } else if (kind === "worker") {
    c.moveTo(-8, sh[1] - 6); c.lineTo(-12, sh[1] + 4); c.lineTo(-10, hip[1] + 8); c.lineTo(10, hip[1] + 8); c.lineTo(12, sh[1] + 4); c.lineTo(7, sh[1] - 6); c.closePath(); c.fill();
  } else {

    c.moveTo(-8, sh[1] - 6); c.lineTo(-12, sh[1] + 4); c.lineTo(-10, hip[1] - 4); c.lineTo(...tail); c.lineTo(seated ? 14 : 6, seated ? hip[1] + 6 : hip[1] + 36); c.lineTo(10, hip[1] - 6); c.lineTo(12, sh[1] + 4); c.lineTo(7, sh[1] - 6); c.closePath(); c.fill();

  const hat = o.hat === "none" ? null : o.hat ?? (kind === "man" ? "top" : kind === "soldier" ? "shako" : kind === "worker" ? "cap" : kind === "woman" ? "bonnet" : null);

  if (hat === "shako") { c.beginPath(); c.moveTo(-9, -11); c.lineTo(10, -11); c.lineTo(18, -9.5); c.lineTo(18, -11.5); c.lineTo(11.5, -13); c.lineTo(12.5, -33); c.lineTo(-10, -33); c.closePath(); c.fill(); c.beginPath(); c.ellipse(4, -38, 3, 6, .2, 0, 7); c.fill(); }

}
/* silhouette bust in an oval (the period portrait) */
function bust(c, x, y, s) {
  c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = css(SIL);

/* ---------- engraved bits drawn in 2D ---------- */

/* Paxton's blotting-paper sketch, drawn by an ink pen. p = 0..1 progress */
const SKETCH = (() => { const S = [], L = (x0, y0, x1, y1) => S.push([[x0, y0], [x1, y1]]);

/* ======================= SCENES (photographic) ======================= */
/* layered(): Ken Burns on the background, the cut-out subject on its own layer moving a little more (parallax).

const SX = ix => CX + (ix - 600) * .9, SY = iy => CY + (iy - 1067) * .9;

const HUB = [SX(620), SY(1480)];              // centre of the leaf's ribs (underside photo)

SCENES.forEach((s, i) => { s.end = i < SCENES.length - 1 ? SCENES[i + 1].start : DUR; });
const TD = .7;

/* ======================= COMPOSITE ======================= */
let FRAME = 0;
function drawScene(c, sc, t) { c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.filter = "none"; c.globalCompositeOperation = "source-over"; paper(c); c.save(); sc.draw(c, t); c.restore(); }
function render(c, t) {
  let i = SCENES.findIndex(s => t >= s.start && t < s.end); if (i < 0) i = SCENES.length - 1;
  const sc = SCENES[i], nx = SCENES[i + 1];
  if (nx && t > nx.start - TD / 2) {           // transition into the next scene
    const p = E.inOut(prog(t, nx.start - TD / 2, nx.start + TD / 2));
    drawScene(aCtx, sc, t); drawScene(bCtx, nx, t);
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1;
    if (nx.fade === "cream") { c.drawImage(bufA, 0, 0); c.globalAlpha = clamp(p * 2); paper(c); c.globalAlpha = clamp(p * 2 - 1); c.drawImage(bufB, 0, 0); }
    else { c.drawImage(bufA, 0, 0); c.globalAlpha = p; c.drawImage(bufB, 0, 0); }
    c.globalAlpha = 1;
  } else if (i > 0 && t < sc.start + TD / 2) {   // second half of the incoming transition
    const pv = SCENES[i - 1], p = E.inOut(prog(t, sc.start - TD / 2, sc.start + TD / 2));
    drawScene(aCtx, pv, t); drawScene(bCtx, sc, t);
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1;
    if (sc.fade === "cream") { c.drawImage(bufA, 0, 0); c.globalAlpha = clamp(p * 2); paper(c); c.globalAlpha = clamp(p * 2 - 1); c.drawImage(bufB, 0, 0); }
    else { c.drawImage(bufA, 0, 0); c.globalAlpha = p; c.drawImage(bufB, 0, 0); }
    c.globalAlpha = 1;
  } else drawScene(c, sc, t);

}
function renderFrame(f, samples = 1) {
  FRAME = f; const t = f / FPS;
  if (samples <= 1) { render(ctx, t); return; }
  for (let k = 0; k < samples; k++) { render(wCtx, Math.max(0, (f - k / samples * CONFIG.shutter) / FPS)); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1 / (k + 1); ctx.drawImage(work, 0, 0); }
  ctx.globalAlpha = 1;
}

/* ======================= PLAYER ======================= */
const ready = (async () => { await Promise.all(["ISI", "ISR"].map(f => document.fonts.load(`60px ${f}`))); await document.fonts.ready; await loadSprites(); })();
window.REEL = { ready, renderFrame, canvas: cv, FRAMES, FPS, CONFIG };
const $ = id => document.getElementById(id), scrub = $("scrub"), timeEl = $("time"), playBtn = $("play");
scrub.max = FRAMES - 1;
let frame = 0, playing = false, t0 = 0, f0 = 0;
const AUDIO_SRC = "__AUDIO__", snd = AUDIO_SRC.startsWith("data:") ? new Audio(AUDIO_SRC) : null;
const show = f => { frame = Math.max(0, Math.min(FRAMES - 1, f)); renderFrame(frame, 1); scrub.value = frame; timeEl.textContent = `${(frame / FPS).toFixed(2).padStart(5, "0")} / ${DUR.toFixed(2)}  f${frame}`; };
const loop = now => { if (!playing) return; const f = snd ? Math.floor(snd.currentTime * FPS) : f0 + Math.floor((now - t0) / 1000 * FPS); if (snd && snd.ended) { snd.currentTime = 0; snd.play(); } show(f % FRAMES); requestAnimationFrame(loop); };
const toggle = () => { playing = !playing; playBtn.textContent = playing ? "Pause" : "Play"; if (playing) { t0 = performance.now(); f0 = frame; if (snd) { snd.currentTime = frame / FPS; snd.play(); } requestAnimationFrame(loop); } else if (snd) snd.pause(); };
playBtn.onclick = toggle; $("prev").onclick = () => show(frame - 1); $("next").onclick = () => show(frame + 1);
scrub.oninput = () => { playing = false; playBtn.textContent = "Play"; if (snd) snd.pause(); show(+scrub.value); };
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); toggle(); } if (e.key === "ArrowLeft") show(frame - 1); if (e.key === "ArrowRight") show(frame + 1); });
SCENES.forEach(s => { const d = document.createElement("div"); d.style.width = ((s.end - s.start) / DUR * 100) + "%"; d.textContent = s.name; d.onclick = () => show(Math.round(s.start * FPS)); $("beats").appendChild(d); });
ready.then(() => { if (!window.__EXPORT__) show(0); });
