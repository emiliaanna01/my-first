<script>
/* Period studio: builds the 1849–51 scenes as simple 3D models. render.cjs calls
   window.shoot(name, pass) — pass "shade" gives lit greyscale, pass "id" gives flat material colours
   that post.py uses for ink contours and hand-tinting (teal glass, walnut wood). */
const D = Math.PI / 180;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setClearColor(0x000000, 0);
renderer.outputEncoding = THREE.sRGBEncoding; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* material categories: shade albedo + id colour */
const CAT = {
  skin:  [0xd8c8b8, 0xff8080], coat: [0x34302c, 0x204060], cloth: [0x6a6058, 0x406080], white: [0xf0ece4, 0xffffff],
  hair:  [0x2e2824, 0x402020], hat: [0x1e1c1a, 0x101010], dress: [0x8e8274, 0xa060c0], wood: [0x8a6a4c, 0xc08040],
  iron:  [0x4a4a4c, 0x606060], glass: [0xc8d2d2, 0x00ffff], leaf: [0x8c9a78, 0x40c040], flower: [0xf6f2ea, 0xffff80],
  water: [0xb4b8b0, 0x0000ff], ground: [0xb4a890, 0x806040], stone: [0xa89e8c, 0xa0a080], paper: [0xeee4d0, 0xffe0c0],
  red:   [0x7a4a3c, 0xff0000], brass: [0xb09060, 0xffc000],

const MAT = {}; for (const k in CAT) MAT[k] = new THREE.MeshStandardMaterial({ color: CAT[k][0], roughness: .7, metalness: k === "iron" ? .3 : 0 });
const mesh = (g, k, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(g, MAT[k]); o.userData.k = k; o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; return o; };
const grp = (...kids) => { const g = new THREE.Group(); kids.forEach(k => k && g.add(k)); return g; };
const ell = (rx, ry, rz, k) => { const o = mesh(new THREE.SphereGeometry(1, 32, 24), k); o.scale.set(rx, ry, rz); return o; };
const cap = (r, len, k) => mesh(new THREE.CapsuleGeometry(r, len, 8, 16), k);
const box = (w, h, d, k) => mesh(new THREE.BoxGeometry(w, h, d), k);
const cyl = (r1, r2, h, k, seg = 32) => mesh(new THREE.CylinderGeometry(r1, r2, h, seg), k);
const lathe = (pts, k, seg = 48) => mesh(new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), seg), k);
const at = (o, x, y, z, rx = 0, ry = 0, rz = 0) => { o.position.set(x, y, z); o.rotation.set(rx, ry, rz); return o; };

/* ---------- people ---------- */
function person(o = {}) {
  const kind = o.kind || "man", pose = o.pose || {}, P = n => (pose[n] || [0, 0, 0]).map(v => v * D);
  const J = (name, x, y, z, ...kids) => { const g = grp(...kids); g.position.set(x, y, z); g.rotation.set(...P(name), "YXZ"); return g; };
  const female = kind === "woman" || kind === "girl";
  const coatK = kind === "soldier" ? "red" : kind === "worker" ? "cloth" : "coat";
  const limb = (r, len, k) => { const c = cap(r, len, k); c.position.y = -len / 2 - r * .3; return c; };
  const hand = () => { const h = ell(.04, .07, .025, "skin"); h.position.y = -.07; return h; };
  const arm = s => J("shoulder" + s, s === "L" ? .19 : -.19, .16, 0, ell(.06, .06, .06, female ? "dress" : coatK), limb(.046, .25, female ? "dress" : coatK),
    J("elbow" + s, 0, -.32, 0, limb(.04, .22, female ? "dress" : coatK), J("wrist" + s, 0, -.29, 0, hand(), o.pen && s === "R" ? at(cyl(.006, .004, .16, "hat", 8), 0, -.1, .04, 70 * D, 0, 0) : null)));
  const leg = s => J("hip" + s, s === "L" ? .09 : -.09, -.06, 0, limb(.07, .38, kind === "soldier" ? "coat" : "cloth"),
    J("knee" + s, 0, -.47, 0, limb(.056, .37, kind === "soldier" ? "coat" : "cloth"), J("ankle" + s, 0, -.46, 0, at(ell(.05, .035, .12, "hat"), 0, -.03, .05))));
  // head
  const head = grp(at(ell(.088, .112, .1, "skin"), 0, .12, 0), at(ell(.016, .03, .02, "skin"), 0, .11, .1), at(ell(.06, .012, .02, "hair"), 0, .16, .085),
    at(ell(.012, .025, .02, "skin"), .09, .12, 0), at(ell(.012, .025, .02, "skin"), -.09, .12, 0),
    at(ell(.012, .008, .006, "hat"), .032, .135, .093), at(ell(.012, .008, .006, "hat"), -.032, .135, .093));
  if (female) { head.add(at(ell(.096, .1, .1, "hair"), 0, .16, -.02)); head.add(at(ell(.05, .05, .05, "hair"), 0, .17, -.1)); }
  else { head.add(at(ell(.094, .07, .1, "hair"), 0, .19, -.012)); if (o.whiskers) { head.add(at(ell(.014, .045, .03, "hair"), .086, .085, .03)); head.add(at(ell(.014, .045, .03, "hair"), -.086, .085, .03)); } }
  if (o.hat === "top") { head.add(at(cyl(.085, .08, .2, "hat"), 0, .32, 0)); head.add(at(cyl(.14, .14, .012, "hat"), 0, .22, 0)); }
  if (o.hat === "shako") { head.add(at(cyl(.09, .078, .17, "hat"), 0, .3, 0)); head.add(at(box(.12, .01, .08, "hat"), 0, .22, .09, -.3)); head.add(at(ell(.02, .03, .02, "white"), 0, .41, .02)); }
  if (o.hat === "cap") { head.add(at(ell(.1, .04, .11, "cloth"), 0, .225, 0)); head.add(at(box(.13, .008, .07, "cloth"), 0, .205, .1)); }
  if (o.hat === "bonnet") { head.add(at(ell(.12, .12, .12, "dress"), 0, .15, -.03)); }
  const neck = J("neck", 0, .22, 0, at(cap(.04, .06, "skin"), 0, .04, 0), J("head", 0, .08, 0, head),
    female ? null : at(ell(.07, .035, .05, "white"), 0, .0, .04));
  const torso = female ? at(ell(.15, .2, .1, "dress"), 0, .02, 0) : at(ell(.175, .22, .12, coatK), 0, .02, 0);
  const chest = grp(torso, neck, arm("L"), arm("R"));
  if (!female && kind !== "worker") chest.add(at(ell(.06, .12, .02, kind === "soldier" ? "white" : "cloth"), 0, .0, .105));
  if (kind === "soldier") { chest.add(at(box(.035, .5, .01, "white"), .02, 0, .118, 0, 0, .55)); chest.add(at(box(.035, .5, .01, "white"), -.02, 0, .118, 0, 0, -.55)); }
  const spine = J("spine", 0, .1, 0, at(grp(chest), 0, .2, 0));
  const pel = J("pelvis", 0, 0, 0, ell(.15, .1, .11, female ? "dress" : coatK), spine);
  if (female) pel.add(at(lathe([[0, .02], [.15, .02], [.24, -.25], [.36, -.6], [.44, -.86], [.46, -.92], [0, -.92]], "dress"), 0, 0, 0));
  else { pel.add(leg("L")); pel.add(leg("R")); if (kind === "man" || kind === "soldier") pel.add(at(lathe([[.155, .02], [.17, -.2], [.185, -.46], [.18, -.48]], coatK), 0, 0, 0)); }
  if (kind === "soldier" && o.musket) chest.add(at(cyl(.012, .012, 1.3, "wood", 8), .2, .25, -.05, 0, 0, -.12));
  const root = grp(pel); root.position.y = pose.y ?? .98; root.scale.setScalar(o.scale || 1);
  if (pose.root) root.rotation.set(...pose.root.map(v => v * D));
  return root;
}
const POSE = {
  stand: { shoulderL: [0, 0, 7], shoulderR: [0, 0, -7], elbowL: [-10, 0, 0], elbowR: [-10, 0, 0] },
  girl: { shoulderL: [-20, 0, 30], shoulderR: [-20, 0, -30], elbowL: [-30, 0, 0], elbowR: [-30, 0, 0], head: [-6, 0, 0], y: .98 },
  gesture: { shoulderL: [-40, 0, 26], elbowL: [-40, 0, 0], shoulderR: [6, 0, -8], elbowR: [-18, 0, 0], neck: [0, 18, 0], head: [-4, 8, 0] },
  lapels: { shoulderL: [4, 0, 6], elbowL: [-8, 0, 0], shoulderR: [-22, 0, -8], elbowR: [-100, 0, 0], wristR: [0, 0, 0], neck: [0, -14, 0], head: [-6, -6, 0] },
  seated: { y: .56, hipL: [-90, 0, 4], hipR: [-90, 0, -4], kneeL: [90, 0, 0], kneeR: [90, 0, 0], shoulderL: [-40, 0, 10], elbowL: [-50, 0, 0], shoulderR: [-40, 0, -10], elbowR: [-50, 0, 0] },
  writing: { y: .56, spine: [16, 0, 0], neck: [18, 0, 0], hipL: [-90, 0, 4], hipR: [-90, 0, -4], kneeL: [90, 0, 0], kneeR: [90, 0, 0], shoulderL: [-50, 0, 14], elbowL: [-60, 0, 0], shoulderR: [-62, 0, -6], elbowR: [-40, 0, 0], wristR: [-20, 0, 0] },
  marchA: { hipL: [-26, 0, 0], kneeL: [10, 0, 0], hipR: [16, 0, 0], kneeR: [20, 0, 0], shoulderL: [12, 0, 6], elbowL: [-10, 0, 0], shoulderR: [-170, 0, -6], elbowR: [-20, 0, 0], y: .97 },
  marchB: { hipL: [16, 0, 0], kneeL: [20, 0, 0], hipR: [-26, 0, 0], kneeR: [10, 0, 0], shoulderL: [-14, 0, 6], elbowL: [-14, 0, 0], shoulderR: [-170, 0, -6], elbowR: [-20, 0, 0], y: .97 },
  work: { spine: [30, 0, 0], shoulderL: [-80, 0, 10], elbowL: [-30, 0, 0], shoulderR: [-90, 0, -10], elbowR: [-20, 0, 0], hipL: [-20, 0, 0], kneeL: [30, 0, 0], y: .93 },
  climb: { shoulderL: [-150, 0, 10], elbowL: [-20, 0, 0], shoulderR: [-120, 0, -10], elbowR: [-30, 0, 0], hipL: [-60, 0, 0], kneeL: [70, 0, 0], hipR: [-10, 0, 0], kneeR: [20, 0, 0] },
  stroll: { hipL: [-14, 0, 0], kneeL: [8, 0, 0], hipR: [10, 0, 0], kneeR: [14, 0, 0], shoulderL: [8, 0, 6], shoulderR: [-8, 0, -6] },

/* ---------- textures ---------- */
function gridTex(cols, rows, bar = 4, bg = "#e8eeee", fg = "#3a4040") {
  const c = document.createElement("canvas"); c.width = cols * 32; c.height = rows * 32; const k = c.getContext("2d");
  k.fillStyle = bg; k.fillRect(0, 0, c.width, c.height); k.fillStyle = fg;
  for (let i = 0; i <= cols; i++) k.fillRect(i * 32 - bar / 2, 0, bar, c.height);
  for (let j = 0; j <= rows; j++) k.fillRect(0, j * 32 - bar / 2, c.width, bar);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
}
function veinTex() {
  const c = document.createElement("canvas"); c.width = c.height = 1024; const k = c.getContext("2d"); k.fillStyle = "#9aa886"; k.fillRect(0, 0, 1024, 1024);
  k.translate(512, 512); k.strokeStyle = "#5e6a4e"; k.lineWidth = 5;
  for (let i = 0; i < 28; i++) { k.save(); k.rotate(i / 28 * Math.PI * 2); k.beginPath(); k.moveTo(0, 0); k.lineTo(0, 500); k.stroke(); k.restore(); }
  k.lineWidth = 2.5; for (const r of [120, 220, 310, 390, 450]) { k.beginPath(); for (let a = 0; a <= 360; a += 4) { const rr = r + Math.sin(a * D * 28) * 8; k.lineTo(Math.cos(a * D) * rr, Math.sin(a * D) * rr); } k.stroke(); }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
function texMesh(g, k, tex) { const m = mesh(g, k); m.material = MAT[k].clone(); m.material.map = tex; m.material.color.set(0xffffff); return m; }

/* ---------- props ---------- */
function lilyPad(r = 1, underside = false) {
  const g = grp();
  const top = texMesh(new THREE.CircleGeometry(r * .97, 96), "leaf", veinTex()); top.rotation.x = -90 * D; top.position.y = .012; g.add(top);
  g.add(lathe([[0, 0], [r * .97, 0], [r * .985, .02], [r, .08], [r * .99, .085], [r * .96, .01]], "leaf", 96));
  if (underside) {
    for (let i = 0; i < 28; i++) { const a = i / 28 * Math.PI * 2, rib = box(r * .94, .05, .022, "leaf"); rib.position.set(Math.cos(a) * r * .47, -.03, Math.sin(a) * r * .47); rib.rotation.y = -a; g.add(rib); }
    for (const rr of [.24, .44, .62, .78, .9]) { const t = mesh(new THREE.TorusGeometry(rr * r, .009, 6, 140), "leaf"); t.rotation.x = 90 * D; t.position.y = -.02; g.add(t); }
    g.add(at(cyl(.06, .04, .3, "leaf"), 0, -.15, 0));
  }

}
function lilyFlower(s = 1) {
  const g = grp(); for (let ring = 0; ring < 4; ring++) { const n = 10 + ring * 4, R = .05 + ring * .045;
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + ring, p = ell(.035, .012, .1 - ring * .012, "flower"); p.position.set(Math.cos(a) * R, .06 + (3 - ring) * .03, Math.sin(a) * R);
      p.rotation.set(0, -a + Math.PI / 2, 0); p.rotateX(-(.6 + ring * .25)); g.add(p); } }
  g.add(at(ell(.06, .04, .06, "brass"), 0, .17, 0)); g.scale.setScalar(s); return g;
}
function arch(r, w, k, segs = 1) { const t = mesh(new THREE.TorusGeometry(r, w, 8, 64, Math.PI), k); return t; }
function glasshouse(len = 8, r = 3.2) {
  const g = grp();
  for (let i = 0; i <= 8; i++) { const a = arch(r, .035, "iron"); a.position.set(0, 0, -i * len / 8); g.add(a); }
  for (let j = 1; j < 12; j++) { const a = j / 12 * Math.PI, p = cyl(.012, .012, len, "iron", 6); p.rotation.x = 90 * D; p.position.set(Math.cos(a) * r, Math.sin(a) * r, -len / 2); g.add(p); }
  const shell = texMesh(new THREE.CylinderGeometry(r * .995, r * .995, len, 64, 1, true, -Math.PI / 2, Math.PI), "glass", gridTex(30, 12, 3));
  shell.material.side = THREE.BackSide; shell.material.transparent = true; shell.material.opacity = .55; shell.rotation.z = 90 * D; shell.rotation.y = 90 * D; shell.position.set(0, 0, -len / 2); g.add(shell);

}
function column(h, k = "iron") { const g = grp(cyl(.07, .08, h, k, 16)); g.children[0].position.y = h / 2; g.add(at(box(.24, .08, .24, k), 0, h - .04, 0)); g.add(at(box(.22, .06, .22, k), 0, .03, 0)); return g; }
function girder(len, k = "iron") { const g = grp(at(box(len, .05, .06, k), 0, .25, 0), at(box(len, .05, .06, k), 0, -.25, 0));
  const n = Math.round(len / .5); for (let i = 0; i < n; i++) { const d = box(.035, .7, .03, k); d.position.x = -len / 2 + (i + .5) * len / n; d.rotation.z = (i % 2 ? 1 : -1) * 45 * D; g.add(d); } return g; }
function tree(h = 9, seed = 1) {
  const g = grp(at(cyl(.22, .38, h * .55, "wood", 12), 0, h * .27, 0));
  let s = seed; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 320; i++) { const r = .22 + rnd() * .38, a = rnd() * 7, y = h * .48 + rnd() * h * .5, d = Math.pow(rnd(), .6) * 2.6 * (1 - (y - h * .48) / (h * .62));

function crystalPalace() {
  const g = grp(), L = 64, tex = (c, r) => gridTex(c, r, 3, "#dfe6e6", "#3c4444");
  const tier = (w, h, y, len) => { const m = new THREE.Mesh(new THREE.BoxGeometry(len, h, w), [MAT.glass, MAT.glass, MAT.iron, MAT.iron, MAT.glass, MAT.glass].map(() => { const mm = MAT.glass.clone(); mm.map = tex(Math.round(len / .9), Math.round(h / .9)); mm.color.set(0xffffff); return mm; }));
    m.userData.k = "glass"; m.position.y = y + h / 2; m.castShadow = m.receiveShadow = true; return m; };
  g.add(tier(14, 3.2, 0, L)); g.add(tier(9, 2.6, 3.2, L - 4)); g.add(tier(4.5, 2.4, 5.8, L - 10));
  [3.2, 5.8, 8.2].forEach(y => g.add(at(box(L + .2, .18, .2, "iron"), 0, y, 7.1 * (y === 3.2 ? 1 : y === 5.8 ? .66 : .33))));
  // transept barrel vault
  const vault = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 18, 64, 1, true, -Math.PI / 2, Math.PI), (() => { const mm = MAT.glass.clone(); mm.map = gridTex(48, 18, 3, "#dfe6e6", "#3c4444"); mm.color.set(0xffffff); mm.side = THREE.DoubleSide; return mm; })());
  vault.userData.k = "glass"; vault.position.set(0, 8.2, 0); vault.rotation.set(-90 * D, 0, 0); g.add(vault);
  const tbody = tier(18, 8.2, 0, 10); g.add(tbody);
  // lunette: semicircle with radiating bars (the leaf, in iron)
  const lun = new THREE.Mesh(new THREE.CircleGeometry(5, 64, 0, Math.PI), (() => { const mm = MAT.glass.clone(); mm.color.set(0xd6e0e0); return mm; })()); lun.userData.k = "glass"; lun.position.set(0, 8.2, 9.02); g.add(lun);
  for (let i = 0; i <= 16; i++) { const a = i / 16 * Math.PI, b = box(5, .06, .06, "iron"); b.position.set(Math.cos(a) * 2.5, 8.2 + Math.sin(a) * 2.5, 9.05); b.rotation.z = a; g.add(b); }
  for (const rr of [1.5, 3, 4.2, 5]) { const t = mesh(new THREE.TorusGeometry(rr, .05, 6, 64, Math.PI), "iron"); t.position.set(0, 8.2, 9.05); g.add(t); }
  for (let i = -3; i <= 3; i++) { const f = grp(at(cyl(.03, .03, 2.2, "iron", 6), 0, 1.1, 0), at(box(.9, .5, .01, "red"), .45, 1.9, 0)); f.position.set(i * 9, 8.2, 2.2); g.add(f); }
  return g;
}
function crowd(n, spread, depth, seed = 3, scale = 1) {
  const g = grp(); let s = seed; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < n; i++) { const female = rnd() < .4; const p = person({ kind: female ? "woman" : "man", hat: female ? "bonnet" : (rnd() < .8 ? "top" : null), pose: POSE.stroll, scale: scale * (.94 + rnd() * .1) });
    p.position.set((rnd() - .5) * spread, 0, (rnd() - .5) * depth); p.rotation.y = (rnd() - .5) * 1.2 + (rnd() < .5 ? 0 : Math.PI); g.add(p); }
  return g;
}

/* ---------- shots: objects + camera ---------- */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const SHOTS = {

  paxton: { size: [1200, 1500], build: () => [person({ kind: "man", pose: POSE.lapels, whiskers: true })], cam: [V(-.4, 1.45, 2.3), V(0, 1.25, 0), 30] },

      at(cyl(1.55, 1.55, .02, "water", 96), .9, .46, -.6), at(lilyPad(.62), .5, .47, -.6), at(lilyPad(.45), 1.5, .47, -.2), at(lilyFlower(1.0), 1.1, .47, -1.1)], cam: [V(.6, 2.3, 6.8), V(.1, .9, -.4), 36] },

  meeting: { size: [1200, 1500], build: () => { const g = [at(box(2.4, .06, 1.2, "wood"), 0, .76, 0), ...[[-1, -.4], [1, -.4], [-1, .4], [1, .4]].map(([x, z]) => at(box(.07, .76, .07, "wood"), x, .38, z))];
      g.push(at(box(.3, .005, .22, "paper"), .1, .795, .3, 0, .2, 0), at(box(.26, .005, .2, "paper"), -.6, .795, -.2, 0, -.3, 0));
      g.push(at(cyl(.035, .03, .07, "hat"), -.2, .83, .25), at(box(.5, .02, .36, "paper"), .35, .8, .1, 0, -.1, 0));

  hydepark: { size: [1200, 2134], build: () => { const g = [at(box(80, .02, 80, "ground"), 0, -.01, -20)]; [[-9, -14], [-3, -22], [5, -18], [11, -26], [-14, -30], [16, -12], [0, -40], [-20, -16]].forEach(([x, z], i) => g.push(at(tree(10 + (i % 3) * 2, i + 2), x, 0, z)));
