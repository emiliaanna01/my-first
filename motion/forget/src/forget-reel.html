<!doctype html>
<html lang="en">

<title>Forgetting Curve Reel</title>
<script>
/* =====================================================================
   EDIT ME — palette, copy and timing. Times are seconds and follow the
   voice-over (see motion/forget/vo.py). Save and reload to see changes.
   ===================================================================== */
const CONFIG = {
  color: {
    bg:     "#F3F0E8",   // warm paper
    ink:    "#121212",
    accent: "#FF4A1C",   // the one loud colour: key words, numbers, highlights
    blue:   "#2D5BFF",   // UI only: the cursor
    grey:   "#C9C3B6",
    card:   "#FFFFFF",
  },
  copy: {
    hook: ["YOU'LL", "FORGET"], tomorrow: "TOMORROW",
    notYou: ["NOT", "YOU"], brain: ["YOUR", "BRAIN"],
    hours: "IN 24 HOURS",
    upTo: "UP TO", stat: 67, statLabel: "OF WHAT YOU LEARN",
    curve: ["FORGETTING", "CURVE"], source: "Ebbinghaus, 1885",
    fix: ["THE", "FIX?"],
    review: "REVIEW", reviewSub: "RIGHT BEFORE YOU FORGET",
    flat: "FLATTENS", flatSub: "THE CURVE", sticks: "IT STICKS",
    save: "SAVE THIS", dont: "DON'T", forgetIt: ["FORGET", "IT"], follow: "follow for more →",
  },
  fps: 30, duration: 19.6, motionBlurSamples: 6, shutter: 0.5,
};
/* Voice-over word/clip times (seconds) — every visual keys off these. */
const T = {
  video: 1.18, tomorrow: 1.54, notYou: 2.44, strike: 2.86, brain: 3.27, day: 4.29, lose: 5.07, stat: 6.03,
  learn: 7.09, curve: 8.10, fix: 9.70, review: 10.49, before: 11.25, click: 11.62,
  d1: 12.31, d3: 12.99, d7: 13.78, flat: 14.71, flattens: 15.25, save: 16.51, tap: 17.0, cta: 17.36,
};
const BEATS = [
  { name: "Hook", start: 0, end: 2.4 }, { name: "Brain", start: 2.4, end: 4.25 }, { name: "67%", start: 4.25, end: 8.0 },
  { name: "Curve", start: 8.0, end: 9.66 }, { name: "Fix", start: 9.66, end: 12.25 }, { name: "Days", start: 12.25, end: 14.65 },
  { name: "Flatten", start: 14.65, end: 16.45 }, { name: "Save", start: 16.45, end: 19.6 },
];
const CUES = [
  [0.0, "bass hit"], [0.55, "pop"], [1.18, "marker scribble"], [1.6, "glitch / pixel dissolve"], [2.32, "whip"],
  [2.86, "scratch"], [3.27, "pop"], [4.18, "zoom-through whoosh"], [4.35, "clock ticks"], [6.03, "impact + counter"],
  [7.1, "falling whooshes"], [8.0, "swipe"], [8.25, "pencil draw"], [9.66, "bass hit + glitch, music stops"],
  [10.38, "cut back, music returns"], [11.62, "cursor click"], [12.31, "pop 1"], [12.99, "pop 2"], [13.78, "pop 3"],
  [15.25, "squash thud"], [16.3, "circle whoosh"], [17.0, "tap + pop burst"], [18.4, "final soft hit"],
].map(([t, sfx]) => ({ t, sfx }));
</script>
<style>
/*FONTS*/
:root { --bg:#0d0d0f; --fg:#e9e9ef; --muted:#8a8a98; --line:#24242c; --accent:#FF4A1C; }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font: 13px/1.4 "Mono", ui-monospace, monospace; }

canvas#c { display:block; width:min(calc(100vw - 32px), calc((100vh - 150px) * 0.5625)); height:auto; aspect-ratio:9/16; border-radius:10px; box-shadow:0 0 0 1px var(--line); }
.bar { width:min(calc(100vw - 32px), 640px); display:flex; flex-direction:column; gap:8px; }

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="bar">
  <div class="row">
    <button id="play">Play</button><button id="prev">◀︎</button><button id="next">▶︎</button>
    <span id="time"></span><label><input type="checkbox" id="mb"> motion blur</label>
  </div>
  <input type="range" id="scrub" min="0" value="0" step="1">
  <div class="beats" id="beats"></div>
</div>
<script>
"use strict";
const W = 1080, H = 1920, CX = 540, CY = 960;
const FPS = CONFIG.fps, DUR = CONFIG.duration, FRAMES = Math.round(FPS * DUR);
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const work = document.createElement("canvas"); work.width = W; work.height = H; const wctx = work.getContext("2d");

/* ---------- math ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x), inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  outCubic: x => 1 - Math.pow(1 - x, 3), inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outBack: x => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
/* spring 0 → 1 with overshoot; p is normalised time */
const spring = (p, k = 6.5, w = 11) => p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-k * p) * Math.cos(w * p);
const pop = (t, t0, d = .5) => spring(prog(t, t0, t0 + d));
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

/* ---------- colour ---------- */
const hex = h => { h = h.replace("#", ""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const C = Object.fromEntries(Object.entries(CONFIG.color).map(([k, v]) => [k, hex(v)]));

/* ---------- drawing helpers ---------- */
const font = (fam, size) => `${size}px ${fam}`;
function lay(c, str, fam, size, track = 0) {
  c.font = font(fam, size); const g = [];
  for (let i = 0; i < str.length; i++) g.push({ ch: str[i], x: c.measureText(str.slice(0, i)).width + i * track, w: c.measureText(str[i]).width });
  return { g, width: c.measureText(str).width + (str.length - 1) * track, fam, size, str };
}
function fit(c, str, fam, size, maxW, track = 0) { let L = lay(c, str, fam, size, track); if (L.width > maxW) { const s = size * maxW / L.width; L = lay(c, str, fam, s, track * s / size); } return L; }
function drawLay(c, L, x, y, align = "center", per = null) {
  const ox = align === "center" ? x - L.width / 2 : align === "right" ? x - L.width : x;
  c.font = font(L.fam, L.size); c.textBaseline = "alphabetic"; c.textAlign = "left";
  L.g.forEach((gl, i) => {
    const p = per ? per(i, gl) || {} : {}; const a = p.a ?? 1; if (a <= .001) return;
    c.save(); c.globalAlpha *= a;
    const gx = ox + gl.x + (p.dx || 0), gy = y + (p.dy || 0);
    const sx = (p.s ?? 1) * (p.sx ?? 1), sy = (p.s ?? 1) * (p.sy ?? 1);
    if (sx !== 1 || sy !== 1 || p.r) { c.translate(gx + gl.w / 2, gy); if (p.r) c.rotate(p.r); c.scale(sx, sy); c.translate(-(gx + gl.w / 2), -gy); }
    c.fillStyle = p.color || css(C.ink); c.fillText(gl.ch, gx, gy); c.restore();
  });
  return ox;
}
/* place a whole text block with a transform (scale/rotate about its baseline centre) */
function textBlock(c, L, x, y, { s = 1, sx = 1, sy = 1, r = 0, a = 1, color, per } = {}) {
  if (a <= .001 || s <= .001) return;
  c.save(); c.globalAlpha *= a; c.translate(x, y); c.rotate(r); c.scale(s * sx, s * sy);
  drawLay(c, L, 0, 0, "center", per || (() => ({ color: color || css(C.ink) }))); c.restore();
}
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); };
/* the reel's graphic language: white card, ink outline, hard offset shadow */
function card(c, x, y, w, h, r = 28, { fill = C.card, stroke = C.ink, lw = 5, sh = 10, a = 1 } = {}) {
  if (a <= .001) return;
  c.save(); c.globalAlpha *= a;
  if (sh) { c.fillStyle = css(C.ink); rr(c, x + sh, y + sh, w, h, r); c.fill(); }
  c.fillStyle = css(fill); rr(c, x, y, w, h, r); c.fill();
  if (lw) { c.lineWidth = lw; c.strokeStyle = css(stroke); rr(c, x, y, w, h, r); c.stroke(); }
  c.restore();
}
function mono(c, str, x, y, size, col, a = 1, align = "center", track = 2) {
  c.save(); c.globalAlpha *= a; c.font = font("Mono", size); c.letterSpacing = track + "px"; c.textAlign = align; c.fillStyle = col; c.fillText(str, x, y); c.restore();
}
/* hand-drawn ellipse / stroke, drawn progressively */
function scribbleEllipse(c, x, y, rx, ry, p, col, lw = 9, seed = 1) {
  if (p <= 0) return; c.save(); c.strokeStyle = css(col); c.lineWidth = lw; c.lineCap = "round"; c.beginPath();
  const n = 80, turns = 1.12;
  for (let i = 0; i <= n * p; i++) { const u = i / n, a = -2.2 + u * Math.PI * 2 * turns, wob = 1 + .04 * Math.sin(u * 9 + seed) + .03 * u;
    const px = x + Math.cos(a) * rx * wob, py = y + Math.sin(a) * ry * wob; i ? c.lineTo(px, py) : c.moveTo(px, py); }
  c.stroke(); c.restore();
}
function strokeLine(c, x0, y0, x1, y1, p, col, lw) { if (p <= 0) return; c.save(); c.strokeStyle = css(col); c.lineWidth = lw; c.lineCap = "round";
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(lerp(x0, x1, p), lerp(y0, y1, p)); c.stroke(); c.restore(); }
function cursor(c, x, y, s = 1, press = 0) {
  c.save(); c.translate(x, y); c.scale(s * (1 - .14 * press), s * (1 - .14 * press)); c.rotate(-.12);
  c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 74); c.lineTo(18, 57); c.lineTo(31, 86); c.lineTo(44, 80); c.lineTo(31, 52); c.lineTo(55, 52); c.closePath();
  c.fillStyle = css(C.ink); c.save(); c.translate(5, 6); c.fill(); c.restore();
  c.fillStyle = css(C.blue); c.fill(); c.lineWidth = 5; c.lineJoin = "round"; c.strokeStyle = "#fff"; c.stroke(); c.restore();
}
function camAt(c, s, ax, ay, dx = 0, dy = 0, r = 0) { c.translate(ax + dx, ay + dy); c.rotate(r); c.scale(s, s); c.translate(-ax, -ay); }
function paper(c) {
  c.fillStyle = css(C.bg); c.fillRect(0, 0, W, H);
  c.fillStyle = css(C.ink, .07); for (let y = 40; y < H; y += 60) for (let x = 30; x < W; x += 60) { c.beginPath(); c.arc(x, y, 2, 0, 7); c.fill(); }
}

/* ======================= 1 · HOOK (0 – 2.4) ======================= */
const RC = { x: 540, y: 1260, w: 330, h: 470 };   // the mini reel card
function reelCard(c, t, x, y, s, r) {
  const { w, h } = RC;
  c.save(); c.translate(x, y); c.rotate(r); c.scale(s, s); c.translate(-w / 2, -h / 2);
  card(c, 0, 0, w, h, 34, { fill: C.ink, stroke: C.ink, sh: 12 });
  c.fillStyle = "#fff"; c.beginPath(); c.arc(42, 44, 16, 0, 7); c.fill();
  c.fillStyle = "rgba(255,255,255,.35)"; rr(c, 70, 34, 110, 9, 5); c.fill(); rr(c, 70, 50, 70, 8, 4); c.fill();
  c.fillStyle = "#fff"; c.beginPath(); c.moveTo(w / 2 - 26, h / 2 - 36); c.lineTo(w / 2 + 34, h / 2); c.lineTo(w / 2 - 26, h / 2 + 36); c.closePath(); c.fill();
  mono(c, "this video", w / 2, h / 2 + 96, 24, "rgba(255,255,255,.7)");
  c.fillStyle = "rgba(255,255,255,.2)"; rr(c, 26, h - 40, w - 52, 8, 4); c.fill();
  c.fillStyle = css(C.accent); rr(c, 26, h - 40, (w - 52) * (.18 + .3 * prog(t, .55, 2.2)), 8, 4); c.fill();
  // pixel dissolve: tiles vanish into the paper
  const cols = 10, rows = 14, tw = (w + 24) / cols, th = (h + 24) / rows;
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const k = i * rows + j, tv = 1.62 + hash(k) * .62 + (j / rows) * .1, p = prog(t, tv, tv + .12);
    if (p <= 0) continue; const sz = p;
    c.fillStyle = css(C.bg); c.fillRect(i * tw - 2 + tw * (1 - sz) / 2, j * th - 2 + th * (1 - sz) / 2, tw * sz + 1, th * sz + 1);
  }
  c.restore();
}
function sHook(c, t) {
  const punch = 1 + .05 * (1 - E.outCubic(prog(t, 1.54, 1.9))) * (t > 1.54 ? 1 : 0);
  c.save(); camAt(c, punch, CX, 900);
  const L1 = lay(c, CONFIG.copy.hook[0], "IDBlack", 128, -2);
  { const p = pop(t, .16, .45); textBlock(c, L1, CX, 520, { s: p > 0 ? lerp(1.4, 1, p) : 0, r: -.03 }); }
  const L2 = fit(c, CONFIG.copy.hook[1], "IDBlack", 270, 960, -6);
  drawLay(c, L2, CX, 790, "center", i => { const p = spring(clamp((t + .1) / .45)); return { s: lerp(1.3, 1, p), color: css(C.ink) }; });
  // accent underline swipe on FORGET
  strokeLine(c, CX - L2.width / 2, 830, CX + L2.width / 2, 830, E.outExpo(prog(t, .35, .7)), C.accent, 16);
  // reel card
  const cp = pop(t, .55, .55);
  if (cp > 0) reelCard(c, t, RC.x, RC.y, cp, lerp(-.25, -.05, cp));
  scribbleEllipse(c, RC.x, RC.y, 245, 300, E.outCubic(prog(t, T.video, T.video + .32)), C.accent, 10, 2);
  // tomorrow chip
  const tp = pop(t, T.tomorrow, .5);
  if (tp > 0) {
    c.save(); c.translate(790, 1010); c.rotate(.08); c.scale(tp, tp);
    card(c, -150, -52, 300, 104, 52, { fill: C.accent });
    const L = lay(c, CONFIG.copy.tomorrow, "IDBlack", 50, 1); drawLay(c, L, 0, 18, "center", () => ({ color: "#fff" })); c.restore();
  }
  c.restore();
}

/* ======================= 2 · NOT YOU → YOUR BRAIN (2.4 – 4.25) ======================= */
function brainShape(c, x, y, s, fillC) {
  c.save(); c.translate(x, y); c.scale(s, s);
  const lobes = [[-58, -34, 52], [-12, -58, 56], [42, -40, 54], [62, 10, 48], [20, 40, 52], [-34, 34, 50], [-70, 8, 44]];
  c.beginPath(); lobes.forEach(([lx, ly, r]) => { c.moveTo(lx + r, ly); c.arc(lx, ly, r, 0, Math.PI * 2); });
  c.fillStyle = css(fillC); c.fill();
  c.lineWidth = 6; c.strokeStyle = css(C.ink); lobes.forEach(([lx, ly, r]) => { c.beginPath(); c.arc(lx, ly, r, 0, Math.PI * 2); c.stroke(); });
  c.beginPath(); lobes.forEach(([lx, ly, r]) => { c.moveTo(lx + r - 6, ly); c.arc(lx, ly, r - 6, 0, Math.PI * 2); }); c.fillStyle = css(fillC); c.fill();
  c.strokeStyle = "rgba(255,255,255,.85)"; c.lineWidth = 7; c.lineCap = "round";
  [[-60, -30, -20, -44], [10, -60, 40, -28], [-30, 30, 10, 20], [36, 20, 64, 0]].forEach(([a, b, d, e]) => { c.beginPath(); c.moveTo(a, b); c.quadraticCurveTo((a + d) / 2, b - 24, d, e); c.stroke(); });
  c.restore();
}
const HEAD = { x: 540, y: 1180 };
function sBrain(c, t) {
  const sw = prog(t, T.brain, T.brain + .01) ;
  const zoom = Math.exp(Math.log(9) * E.inExpo(prog(t, 4.02, 4.3)));
  const punch = 1 + .1 * E.outCubic(prog(t, T.brain, T.brain + .3));
  c.save(); camAt(c, punch * zoom, HEAD.x, HEAD.y - 10);
  // person: head + shoulders
  const hr = lerp(118, 175, pop(t, T.brain, .5));
  const ent = pop(t, 2.4, .5);
  c.save(); c.translate(0, (1 - ent) * 120);
  c.fillStyle = css(C.ink); c.beginPath(); c.arc(HEAD.x, HEAD.y + 330, 260, Math.PI, 0); c.fill();
  c.fillStyle = css(sw ? C.card : C.ink); c.lineWidth = 7; c.strokeStyle = css(C.ink); c.beginPath(); c.arc(HEAD.x, HEAD.y, hr, 0, 7); c.fill(); c.stroke();
  if (sw) brainShape(c, HEAD.x, HEAD.y - 4, 1.45 * pop(t, T.brain + .06, .5), C.accent);
  c.restore();
  // text
  if (t < T.brain + .2) {
    const out = E.inCubic(prog(t, T.brain - .05, T.brain + .12));
    const L1 = lay(c, CONFIG.copy.notYou[0], "IDBlack", 200, -4), L2 = lay(c, CONFIG.copy.notYou[1], "IDBlack", 260, -6);
    c.save(); c.beginPath(); c.rect(0, 0, W, 860); c.clip();
    textBlock(c, L1, CX, 520 - out * 500, { s: lerp(1.4, 1, pop(t, 2.42, .45)) });
    textBlock(c, L2, CX, 780 - out * 500, { s: lerp(1.4, 1, pop(t, 2.55, .45)) });
    const sp = E.outExpo(prog(t, T.strike, T.strike + .18));
    c.save(); c.translate(0, -out * 500); strokeLine(c, CX - L2.width / 2 - 30, 720, CX + L2.width / 2 + 30, 676, sp, C.accent, 26); c.restore();
    c.restore();
  }
  if (t >= T.brain - .02) {
    const L1 = lay(c, CONFIG.copy.brain[0], "IDBlack", 150, -3);
    const p1 = pop(t, T.brain, .5), p2 = pop(t, T.brain + .1, .55);
    textBlock(c, L1, CX, 470, { s: p1, r: -.02 });
    const L2 = lay(c, CONFIG.copy.brain[1], "IDBlack", 210, -5);
    if (p2 > 0) { c.save(); c.translate(CX, 700); c.rotate(-.04); c.scale(p2, p2);
      card(c, -L2.width / 2 - 34, -186, L2.width + 68, 236, 26, { fill: C.accent });
      drawLay(c, L2, 0, 0, "center", () => ({ color: "#fff" })); c.restore(); }
  }
  c.restore();
}

/* ======================= 3 · 24 HOURS → 67% (4.25 – 8.0) ======================= */
const CLOCK = { x: 540, y: 900, r: 300 };
function clockFace(c, t, x, y, r) {
  c.save(); c.translate(x, y); const s = r / CLOCK.r; c.scale(s, s);
  c.fillStyle = css(C.ink); c.beginPath(); c.arc(12, 12, CLOCK.r, 0, 7); c.fill();
  c.fillStyle = css(C.card); c.beginPath(); c.arc(0, 0, CLOCK.r, 0, 7); c.fill();
  const sweep = E.inOutCubic(prog(t, 4.36, 5.0)) * Math.PI * 2;
  if (sweep > 0) { c.fillStyle = css(C.accent); c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, CLOCK.r - 6, -Math.PI / 2, -Math.PI / 2 + sweep); c.closePath(); c.fill(); }
  c.lineWidth = 9; c.strokeStyle = css(C.ink); c.beginPath(); c.arc(0, 0, CLOCK.r, 0, 7); c.stroke();
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2, r0 = i % 3 ? 250 : 228; c.lineWidth = i % 3 ? 6 : 10; c.lineCap = "round";
    c.beginPath(); c.moveTo(Math.sin(a) * r0, -Math.cos(a) * r0); c.lineTo(Math.sin(a) * 276, -Math.cos(a) * 276); c.stroke(); }
  c.save(); c.rotate(sweep); c.lineWidth = 16; c.beginPath(); c.moveTo(0, 30); c.lineTo(0, -230); c.stroke(); c.restore();
  c.fillStyle = css(C.ink); c.beginPath(); c.arc(0, 0, 22, 0, 7); c.fill();
  c.restore();
}
const GRID = (() => { const g = []; for (let j = 0; j < 3; j++) for (let i = 0; i < 3; i++) g.push({ x: 540 + (i - 1) * 262, y: 1040 + (j - 1) * 262, i: j * 3 + i }); return g; })();
const KEEP = [1, 5, 6];
function icon(c, k, s) {
  c.save(); c.scale(s, s); c.lineWidth = 9; c.lineCap = "round"; c.lineJoin = "round"; c.strokeStyle = css(C.ink); c.fillStyle = css(C.ink);
  switch (k % 9) {
    case 0: c.beginPath(); c.arc(0, -12, 34, Math.PI * .8, Math.PI * 2.2); c.lineTo(14, 30); c.lineTo(-14, 30); c.closePath(); c.stroke(); c.beginPath(); c.moveTo(-12, 46); c.lineTo(12, 46); c.stroke(); break; // bulb
    case 1: c.beginPath(); c.moveTo(-46, -30); c.lineTo(0, -18); c.lineTo(46, -30); c.lineTo(46, 34); c.lineTo(0, 46); c.lineTo(-46, 34); c.closePath(); c.moveTo(0, -18); c.lineTo(0, 46); c.stroke(); break; // book

    if (t >= 2.4) { c.save(); c.translate(i, 0); sBrain(c, t); c.restore(); }
  }
  else if (t < 4.25) sBrain(c, t);
  else if (t < 4.5) {    // zoom-through the brain → circle opens onto the clock
    c.fillStyle = css(C.accent); c.fillRect(0, 0, W, H);
    const R = E.outCubic(prog(t, 4.25, 4.48)) * 1300;
    c.save(); c.beginPath(); c.arc(CLOCK.x, CLOCK.y, R, 0, 7); c.clip(); paper(c); sStat(c, t); c.restore();
  }
  else if (t < 8.0) sStat(c, t);
  else if (t < 9.66) { sStat(c, t); sCurve(c, t); }
  else if (t < 10.38) sFix(c, t);
  else if (t < 16.3) sCurve(c, t);
  else if (t < 16.5) {   // circle grows from the curve's end dot and opens onto the save beat
    sCurve(c, t); const [ex, ey] = curveEnd(16.3), R = E.inCubic(prog(t, 16.3, 16.5)) * 2300;
    c.save(); c.beginPath(); c.arc(ex, ey, R, 0, 7); c.clip(); c.fillStyle = css(C.accent); c.fillRect(0, 0, W, H);
    c.beginPath(); c.arc(ex, ey, Math.max(0, R - 160), 0, 7); c.clip(); paper(c); sSave(c, t); c.restore();
  }
  else sSave(c, t);
}
function renderFrame(f, samples = 1) {
  const t = f / FPS;
  if (samples <= 1) { render(ctx, t); return; }
  const CUTS = [9.66, 10.38];
  for (let k = 0; k < samples; k++) {
    let tk = (f - (k / samples) * CONFIG.shutter) / FPS;
    for (const cut of CUTS) if (t >= cut && tk < cut) tk = cut;
    render(wctx, Math.max(0, tk));
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1 / (k + 1); ctx.drawImage(work, 0, 0);
  }
  ctx.globalAlpha = 1;
}

/* ======================= PLAYER ======================= */
const ready = (async () => { await Promise.all(["IDBlack", "IDBold", "IDLight", "ISerif", "Mono"].map(f => document.fonts.load(`40px ${f}`))); await document.fonts.ready; })();
window.REEL = { ready, renderFrame, canvas: cv, FRAMES, FPS, CONFIG };
const $ = id => document.getElementById(id), scrub = $("scrub"), timeEl = $("time"), playBtn = $("play"), mb = $("mb");
scrub.max = FRAMES - 1;
let frame = 0, playing = false, t0 = 0, f0 = 0;
const AUDIO_SRC = "__AUDIO__", snd = AUDIO_SRC.startsWith("data:") ? new Audio(AUDIO_SRC) : null;
const show = f => { frame = Math.max(0, Math.min(FRAMES - 1, f)); renderFrame(frame, mb.checked ? 4 : 1); scrub.value = frame;
  timeEl.textContent = `${(frame / FPS).toFixed(2).padStart(5, "0")} / ${DUR.toFixed(2)}  f${frame}`; };
const loop = now => { if (!playing) return;
  const f = snd ? Math.floor(snd.currentTime * FPS) : f0 + Math.floor((now - t0) / 1000 * FPS);
  if (snd && snd.ended) { snd.currentTime = 0; snd.play(); }
  show(f % FRAMES); requestAnimationFrame(loop); };
const toggle = () => { playing = !playing; playBtn.textContent = playing ? "Pause" : "Play";
  if (playing) { t0 = performance.now(); f0 = frame; if (snd) { snd.currentTime = frame / FPS; snd.play(); } requestAnimationFrame(loop); }
  else if (snd) snd.pause(); };
playBtn.onclick = toggle; $("prev").onclick = () => show(frame - 1); $("next").onclick = () => show(frame + 1);
scrub.oninput = () => { playing = false; playBtn.textContent = "Play"; if (snd) snd.pause(); show(+scrub.value); };
mb.onchange = () => show(frame);
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); toggle(); } if (e.key === "ArrowLeft") show(frame - 1); if (e.key === "ArrowRight") show(frame + 1); });
const bx = $("beats");
BEATS.forEach(b => { const d = document.createElement("div"); d.style.width = ((b.end - b.start) / DUR * 100) + "%"; d.textContent = b.name; d.onclick = () => show(Math.round(b.start * FPS)); bx.appendChild(d); });
CUES.forEach(q => { const i = document.createElement("i"); i.style.left = (q.t / DUR * 100) + "%"; i.title = `${q.t.toFixed(2)}s — ${q.sfx}`; bx.appendChild(i); });
ready.then(() => { if (!window.__EXPORT__) show(0); });
</script>
