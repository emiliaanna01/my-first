<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bored on Purpose</title>
<script>
/* =====================================================================
   EDIT ME — palette and the on-screen words. Text times key off the
   voice-over (VO_META below, generated by motion/bored/vo.py): W("clip", n)
   is the moment word n of that clip is spoken.
   ===================================================================== */
const CONFIG = {
  color: {
    ink: "#23275F",                 // condensed navy type
    bg: ["#E4E7FD", "#D6DAFB", "#A2AAEE", "#4D57BD"],   // radial: centre → edge
    shadow: "#4B50B8",              // violet cast shadows
    line: "#FFFFFF",                // orbit / scribble lines
  },
  fps: 30, duration: 48.0, motionBlurSamples: 3, shutter: 0.5,
};
/*VO*/
/*SPRITES*/
</script>
<style>
/*FONTS*/
:root { --bg:#0d0d12; --fg:#e9e9ef; --muted:#8a8a98; --line:#24242c; --accent:#8e95e0; }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font: 13px/1.4 ui-monospace, monospace; }
body { min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:12px; padding:16px; }
canvas#c { display:block; width:min(calc(100vw - 32px), calc((100vh - 150px) * 0.5625)); height:auto; aspect-ratio:9/16; border-radius:10px; box-shadow:0 0 0 1px var(--line); }
.bar { width:min(calc(100vw - 32px), 640px); display:flex; flex-direction:column; gap:8px; }
.row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
button { background:#16161b; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 12px; font:inherit; cursor:pointer; }
#time { font-variant-numeric:tabular-nums; color:var(--muted); min-width:120px; }
input[type=range] { flex:1; min-width:160px; accent-color:var(--accent); }
.beats { display:flex; height:22px; border-radius:6px; overflow:hidden; border:1px solid var(--line); }
.beats div { border-right:1px solid var(--line); color:var(--muted); font-size:10px; display:flex; align-items:center; justify-content:center; white-space:nowrap; overflow:hidden; cursor:pointer; }
.beats div:last-child { border-right:0; }
label { color:var(--muted); display:flex; gap:6px; align-items:center; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="bar">
  <div class="row"><button id="play">Play</button><button id="prev">◀︎</button><button id="next">▶︎</button><span id="time"></span><label><input type="checkbox" id="mb"> motion blur</label></div>
  <input type="range" id="scrub" min="0" value="0" step="1">
  <div class="beats" id="beats"></div>
</div>
<script>
"use strict";
const W_ = 1080, H_ = 1920, CX = 540;
const FPS = CONFIG.fps, DUR = CONFIG.duration, FRAMES = Math.round(FPS * DUR);
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const work = document.createElement("canvas"); work.width = W_; work.height = H_; const wctx = work.getContext("2d");

/* ---------- math ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = { outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x), inQuad: x => x * x, outCubic: x => 1 - Math.pow(1 - x, 3), inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2 };
const spring = (p, k = 7, w = 10) => p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-k * p) * Math.cos(w * p);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const hex = h => { h = h.replace("#", ""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const INK = hex(CONFIG.color.ink), SH = hex(CONFIG.color.shadow), LINE = hex(CONFIG.color.line);

/* ---------- voice-over word timing ---------- */
const VO = Object.fromEntries(VO_META.map(v => [v.id, v]));
/* time word n of a clip is spoken (estimated from letter counts across the clip) */
function W(id, n = 0) {
  const v = VO[id], words = v.text.split(/\s+/), wt = words.map(w => w.replace(/[^a-z0-9']/gi, "").length + 1.6);
  const tot = wt.reduce((a, b) => a + b, 0); let cum = 0; for (let i = 0; i < Math.min(n, words.length); i++) cum += wt[i];
  return v.t + v.dur * (.04 + .9 * cum / tot);
}

/* ---------- sprites ---------- */
const IMG = {}, SIL = {};
function loadSprites() {
  return Promise.all(Object.entries(SPR).map(([k, src]) => new Promise(res => {
    const im = new Image(); im.onload = () => { IMG[k] = im;
      const s = document.createElement("canvas"); s.width = im.width; s.height = im.height; const g = s.getContext("2d");
      g.drawImage(im, 0, 0); g.globalCompositeOperation = "source-in"; g.fillStyle = css(SH); g.fillRect(0, 0, s.width, s.height); SIL[k] = s; res(); };
    im.src = src; })));
}
const mos = document.createElement("canvas"), mctx = mos.getContext("2d");
/* draw a cutout anchored at its bottom-centre (x, y), height h.
   reveal 0..1 resolves it from a pixel mosaic (the reference's entrance). */
function sprite(c, name, x, y, h, { reveal = 1, alpha = 1, rot = 0, shadow = "cast", floor = null, sx = 1 } = {}) {
  const im = IMG[name]; if (!im || alpha <= .001 || reveal <= 0) return;
  const w = im.width * h / im.height;
  c.save(); c.globalAlpha *= alpha;
  if (shadow === "cast" && reveal > .4) {       // flattened silhouette thrown back-right + contact shadow
    c.save(); c.globalAlpha *= .42 * clamp((reveal - .4) / .6); c.filter = "blur(9px)";
    c.setTransform(c.getTransform().multiply(new DOMMatrix([1, 0, -.62, .2, x, y])));
    c.drawImage(SIL[name], -w / 2 * sx, -h, w * sx, h); c.restore();
    c.save(); c.globalAlpha *= .35 * clamp((reveal - .4) / .6); c.filter = "blur(10px)"; c.fillStyle = css(SH);
    c.beginPath(); c.ellipse(x, y - 4, w * .32 * sx, 16, 0, 0, 7); c.fill(); c.restore();
  }
  if (shadow === "float" && reveal > .4) {
    const fy = floor ?? y + 120; c.save(); c.globalAlpha *= .3 * clamp((reveal - .4) / .6); c.filter = "blur(16px)"; c.fillStyle = css(SH);
    c.beginPath(); c.ellipse(x + 30, fy, w * .3 * sx, 22, 0, 0, 7); c.fill(); c.restore();
  }
  c.translate(x, y); c.rotate(rot); c.scale(sx, 1);
  if (reveal >= 1) c.drawImage(im, -w / 2, -h, w, h);
  else {
    const b = Math.max(1, Math.round(lerp(46, 1, E.outCubic(reveal)))), mw = Math.max(1, Math.round(w / b)), mh = Math.max(1, Math.round(h / b));
    mos.width = mw; mos.height = mh; mctx.imageSmoothingEnabled = true; mctx.clearRect(0, 0, mw, mh); mctx.drawImage(im, 0, 0, mw, mh);
    c.imageSmoothingEnabled = false; c.globalAlpha *= clamp(reveal * 2.2); c.drawImage(mos, -w / 2, -h, w, h); c.imageSmoothingEnabled = true;
  }
  c.restore();
}
const rev = (t, t0, d = .38) => prog(t, t0, t0 + d);

/* ---------- type ---------- */
const STY = {
  s:  { fam: "BCL", size: 46, cps: 52 },     // small context, light italic
  b:  { fam: "BCB", size: 150, cps: 26 },    // main phrase, heavy condensed
  bi: { fam: "BCBI", size: 150, cps: 26 },
  h:  { fam: "BCB", size: 330, cps: 20 },    // hero word
  hi: { fam: "BCBI", size: 230, cps: 22 },
};
const lays = new Map();
function layout(c, str, fam, size) {
  const key = str + "|" + fam + "|" + size; if (lays.has(key)) return lays.get(key);
  c.font = `${size}px ${fam}`; const xs = []; for (let i = 0; i <= str.length; i++) xs.push(c.measureText(str.slice(0, i)).width);
  const L = { xs, w: xs[str.length] }; lays.set(key, L); return L;
}
/* typed text: characters appear one by one in their final positions (like the reference) */
function type(c, t, { at, s: str, st = "b", x = CX, y, align = "center", size, alpha = 1, dimAt = null }) {
  at -= .06; if (t < at) return;
  const S = STY[st], sz = size || S.size, fam = S.fam;
  const L = layout(c, str, fam, sz), n = Math.min(str.length, Math.floor((t - at) * S.cps) + 1);
  const ox = align === "center" ? x - L.w / 2 : align === "right" ? x - L.w : x;
  let a = alpha; if (dimAt != null) a *= lerp(1, .32, prog(t, dimAt, dimAt + .2));
  c.save(); c.globalAlpha *= a; c.font = `${sz}px ${fam}`; c.fillStyle = css(INK); c.textBaseline = "alphabetic"; c.textAlign = "left";
  c.fillText(str.slice(0, n), ox, y); c.restore();
}
/* fit a big word to a max width (returns the size to use) */
function fitSize(c, str, st, size, maxW) { const L = layout(c, str, STY[st].fam, size); return L.w > maxW ? Math.floor(size * maxW / L.w) : size; }

/* ---------- editorial lines ---------- */
function orbit(c, x, y, rx, ry, rot, p, phase, part) {   // thin light ellipse, back half behind the object, front half over it
  if (p <= 0) return; c.save(); c.translate(x, y); c.rotate(rot); c.strokeStyle = css(LINE, part === "back" ? .55 : .95); c.lineWidth = 3.2; c.lineCap = "round";
  const a0 = phase, a1 = phase + Math.PI * 2 * p; c.beginPath();
  for (let a = a0; a <= a1 + 1e-6; a += .02) { const front = Math.sin(a) > 0; if ((part === "front") !== front) { c.stroke(); c.beginPath(); continue; }
    const px = Math.cos(a) * rx, py = Math.sin(a) * ry; c.lineTo(px, py); }
  c.stroke(); c.restore();
}
function pathLine(c, pts, p, lw = 3.2, a = .95) {
  if (p <= 0) return; const n = Math.max(2, Math.floor(pts.length * p)); c.save(); c.strokeStyle = css(LINE, a); c.lineWidth = lw; c.lineCap = "round"; c.lineJoin = "round";
  c.beginPath(); for (let i = 0; i < n; i++) i ? c.lineTo(pts[i][0], pts[i][1]) : c.moveTo(pts[i][0], pts[i][1]); c.stroke();
  if (p < 1) { c.fillStyle = css(LINE); c.beginPath(); c.arc(pts[n - 1][0], pts[n - 1][1], 6, 0, 7); c.fill(); }
  c.restore();
}
/* a hand-drawn wandering path from a point */
const WANDER = (() => { const pts = []; let x = 0, y = 0, a = -1.9; for (let i = 0; i < 420; i++) { a += Math.sin(i * .045) * .07 + Math.sin(i * .013 + 1) * .05 + (hash(i) - .5) * .05; x += Math.cos(a) * 6; y += Math.sin(a) * 6; pts.push([x, y]); } return pts; })();
/* pixel-art notification bubble (the reference's pixel cursors, re-imagined) */
const BUBBLE = ["..XXXXXXXXXX..", ".XWWWWWWWWWWX.", "XWWWWWWWWWWWWX", "XWWDWWDWWDWWWX", "XWWWWWWWWWWWWX", ".XWWWWWWWWWWX.", "..XXXWXXXXXX..", "....XWX.......", "....XX........"];
function bubble(c, x, y, px, p, seed) {
  if (p <= 0) return; const s = p >= 1 ? 1 : Math.round(spring(p) * 4) / 4 || .25;
  c.save(); c.translate(x, y); c.scale(s, s);
  const draw = (oy, col, alphaMul) => BUBBLE.forEach((row, j) => [...row].forEach((ch, i) => { if (ch === ".") return;
    c.fillStyle = typeof col === "function" ? col(ch) : col; c.globalAlpha = alphaMul; c.fillRect((i - 7) * px, (j - 9) * px + oy, px + .5, px + .5); }));
  draw(px * 3.2, css(SH, 1), .35);                                         // lavender ghost below (like the reference's sunk cursors)
  draw(0, ch => ch === "X" ? css(INK) : ch === "D" ? css(INK) : "#FFFFFF", 1);
  if (seed % 3 === 0) { c.globalAlpha = 1; c.fillStyle = "#FF5A5A"; c.fillRect(5 * px, -10 * px, px * 2, px * 2); }
  c.restore();
}
function halo(c, x, y, p) {   // white ring pulse + glow
  if (p <= 0) return; const r = lerp(40, 420, E.outCubic(p));
  c.save(); const g = c.createRadialGradient(x, y, 0, x, y, 260); g.addColorStop(0, `rgba(255,255,255,${.55 * (1 - p * .5)})`); g.addColorStop(1, "rgba(255,255,255,0)");
  c.fillStyle = g; c.fillRect(x - 300, y - 300, 600, 600);
  c.strokeStyle = `rgba(255,255,255,${.85 * (1 - p)})`; c.lineWidth = lerp(46, 4, p); c.beginPath(); c.arc(x, y, r, 0, 7); c.stroke(); c.restore();
}

/* ---------- background ---------- */
const grainCv = document.createElement("canvas"); grainCv.width = 540; grainCv.height = 960;
(() => { const g = grainCv.getContext("2d"), d = g.createImageData(540, 960); for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (hash(i * .37) - .5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); })();
function background(c, t) {
  c.save(); c.translate(CX, 880); c.scale(1, 1.62);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, 760); const B = CONFIG.color.bg;
  g.addColorStop(0, B[0]); g.addColorStop(.42, B[1]); g.addColorStop(.78, B[2]); g.addColorStop(1, B[3]);
  c.fillStyle = g; c.fillRect(-CX, -880 / 1.62 - 10, W_, H_ / 1.62 + 20); c.restore();
}
function grain(c, f) {
  c.save(); c.globalAlpha = .07; c.globalCompositeOperation = "overlay";
  const ox = (hash(f) * 200) | 0, oy = (hash(f + 7) * 300) | 0; c.drawImage(grainCv, -ox, -oy, 1080 + 200, 1920 + 300); c.restore();
}
function push(c, t, a, b, amt = .03, ay = 1000) { const s = 1 + amt * E.inOutSine(prog(t, a, b)); c.translate(CX, ay); c.scale(s, s); c.translate(-CX, -ay); }

/* ======================= SCENES ======================= */
const SCENES = [
  { name: "Desk", start: 0, end: 3.1, draw(c, t) {
    push(c, t, 0, 3.1);
    sprite(c, "desk", 540, 1330, 560, { reveal: rev(t, 0, .34) });
    const bt = 1.15, by = 760 + Math.sin(t * 2.2) * 8;
    orbit(c, 860, by - 95, 150, 46, -.15, E.outCubic(prog(t, bt + .25, bt + .9)), t * .6, "back");
    sprite(c, "bulb", 860, by, 190, { reveal: rev(t, bt), shadow: "float", floor: by + 90 });
    orbit(c, 860, by - 95, 150, 46, -.15, E.outCubic(prog(t, bt + .25, bt + .9)), t * .6, "front");
    type(c, t, { at: W("desk", 0), s: "your best", st: "s", y: 400 });
    type(c, t, { at: W("desk", 2), s: "IDEAS", y: 560, size: 190 });
    type(c, t, { at: W("desk", 3), s: "don't arrive", st: "s", x: 470, y: 1500, align: "right" });
    type(c, t, { at: W("desk", 5), s: "at your", st: "s", x: 470, y: 1546, align: "right" });
    type(c, t, { at: W("desk", 7), s: "DESK.", x: 490, y: 1560, align: "left" });
  } },
  { name: "Shower · walk · queue", start: 3.1, end: 7.25, draw(c, t) {
    push(c, t, 3.1, 7.25, .02);
    const tw = VO.walk.t - .05, tq = VO.queue.t - .05;
    if (t < tw) { sprite(c, "shower", 560, 1480, 640, { reveal: rev(t, 3.12), shadow: "float", floor: 1500 }); }
    else if (t < tq) sprite(c, "walk", 540, 1500, 580, { reveal: rev(t, tw) });
    else sprite(c, "queue", 540, 1500, 590, { reveal: rev(t, tq) });
    const rows = [[W("shower", 0), "they show", "up in the", W("shower", 5), "SHOWER", 470], [W("walk", 0), "", "on a", W("walk", 2), "WALK.", 640], [W("queue", 0), "standing", "in a", W("queue", 3), "QUEUE.", 810]];
    rows.forEach(([ts, s1, s2, tb, big, y]) => {
      if (s1) type(c, t, { at: ts, s: s1, st: "s", x: 330, y: y - 52, align: "right" });
      type(c, t, { at: s1 ? ts + .2 : ts, s: s2, st: "s", x: 330, y: y - 6, align: "right" });
      type(c, t, { at: tb, s: big, x: 350, y, align: "left" });
    });
  } },
  { name: "Empty chair", start: 7.25, end: 10.35, draw(c, t) {
    push(c, t, 7.25, 10.35);
    const op = E.outCubic(prog(t, 7.7, 8.8));
    orbit(c, 540, 1180, 330, 90, -.08, op, t * .45, "back");
    sprite(c, "chair", 540, 1360, 540, { reveal: rev(t, 7.3) });
    orbit(c, 540, 1180, 330, 90, -.08, op, t * .45, "front");
    type(c, t, { at: W("places", 0), s: "places where", st: "s", y: 400 });
    type(c, t, { at: W("places", 2), s: "NOTHING", y: 600, size: 230 });
    type(c, t, { at: W("places", 3), s: "is asking for your", st: "s", y: 1500 });
    type(c, t, { at: W("places", 7), s: "ATTENTION.", y: 1650 });
  } },
  { name: "Coincidence", start: 10.35, end: 12.3, draw(c, t) {
    push(c, t, 10.35, 12.3, .04, 960);
    type(c, t, { at: W("coinc", 0), s: "that's not a", st: "s", y: 870, size: 54 });
    type(c, t, { at: W("coinc", 3), s: "COINCIDENCE.", st: "hi", y: 1060, size: fitSize(c, "COINCIDENCE.", "hi", 230, 880) });
  } },
  { name: "Wander", start: 12.3, end: 15.65, draw(c, t) {
    push(c, t, 12.3, 15.65);
    sprite(c, "thinker", 560, 1450, 640, { reveal: rev(t, 12.35) });
    const hx = 600, hy = 860, wp = E.inOutSine(prog(t, W("wander", 8), 15.5));
    pathLine(c, WANDER.map(([x, y]) => [hx + x * .95, hy + y * .95]), wp);
    type(c, t, { at: W("wander", 0), s: "when your mind has", st: "s", y: 400 });
    type(c, t, { at: W("wander", 4), s: "NOTHING TO DO", y: 560 });
    type(c, t, { at: W("wander", 7), s: "it starts to", st: "s", x: 430, y: 1612, align: "right" });
    type(c, t, { at: W("wander", 10), s: "WANDER", st: "bi", x: 450, y: 1640, align: "left", size: 170 });
  } },
  { name: "Memories · problems", start: 15.65, end: 20.05, draw(c, t) {
    push(c, t, 15.65, 20.05, .02);
    const tp = VO.plays.t, flip = spring(prog(t, W("plays", 3), W("plays", 3) + .7));
    const wy = 1110 + Math.sin(t * 1.8) * 7, py = 1180 + Math.sin(t * 1.6 + 1) * 7;
    const lp = E.inOutCubic(prog(t, W("links", 4), W("links", 4) + .7));
    const pts = []; for (let i = 0; i <= 60; i++) { const u = i / 60; pts.push([lerp(400, 690, u), lerp(1000, 1060, u) - Math.sin(u * Math.PI) * 170]); }
    pathLine(c, pts, lp, 3.2, .9);
    sprite(c, "watch", 340, wy, 340, { reveal: rev(t, W("links", 2) - .1), shadow: "float", floor: 1310, rot: Math.sin(t * 2) * .03 });
    sprite(c, "puzzle", 770, py, 300, { reveal: rev(t, W("links", 5) - .1), shadow: "float", floor: 1310, rot: -.6 * Math.sin(Math.PI * flip) * (1 - flip) + (flip > 0 ? Math.sin(flip * Math.PI) * .25 : 0) });
    if (t < tp - .05) {
      type(c, t, { at: W("links", 0), s: "it links", st: "s", y: 380 });
      type(c, t, { at: W("links", 2), s: "OLD MEMORIES", y: 530 });
      type(c, t, { at: W("links", 4), s: "to new", st: "s", x: 430, y: 1478, align: "right" });
      type(c, t, { at: W("links", 6), s: "PROBLEMS.", x: 450, y: 1500, align: "left", size: 130 });
    } else {
      type(c, t, { at: W("plays", 0), s: "it", st: "s", x: 330, y: 494, align: "right" });
      type(c, t, { at: W("plays", 1), s: "REHEARSES.", x: 350, y: 520, align: "left", size: 140 });
      type(c, t, { at: W("plays", 2), s: "it", st: "s", x: 330, y: 664, align: "right" });
      type(c, t, { at: W("plays", 3), s: "PLAYS.", st: "bi", x: 350, y: 690, align: "left", size: 150 });
    }
  } },
  { name: "Default mode", start: 20.05, end: 23.25, draw(c, t) {
    push(c, t, 20.05, 23.25, .035, 1050);
    const ent = E.outCubic(prog(t, 20.1, 20.55));
    sprite(c, "bust", 540, 1720 + (1 - ent) * 200, 880, { reveal: rev(t, 20.1, .45), shadow: "none" });
    const hx = 548, hy = 1150;
    const nodes = []; for (let i = 0; i < 16; i++) { const a = hash(i + 3) * 7, r = .35 + .65 * Math.sqrt(hash(i + 11)); nodes.push([hx + Math.cos(a) * 190 * r, hy - 40 + Math.sin(a) * 210 * r]); }
    const t0 = W("dmn", 5);
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const d = Math.hypot(nodes[i][0] - nodes[j][0], nodes[i][1] - nodes[j][1]); if (d > 170) continue;
      const tl = t0 + ((i * 7 + j * 3) % 17) * .07, p = E.outCubic(prog(t, tl, tl + .25)); if (p <= 0) continue;
      c.save(); c.strokeStyle = css(LINE, .85); c.lineWidth = 2.4; c.beginPath(); c.moveTo(nodes[i][0], nodes[i][1]); c.lineTo(lerp(nodes[i][0], nodes[j][0], p), lerp(nodes[i][1], nodes[j][1], p)); c.stroke(); c.restore();
    }

  { name: "Bus · lift · kettle", start: 30.75, end: 34.05, draw(c, t) {

    else if (t < tk) { sprite(c, "lift", 540, 1390, 560, { reveal: rev(t, tl), shadow: "float", floor: 1480 }); bubble(c, 760, 860, 8, prog(t, tl + .3, tl + .55), 1); }
    else { sprite(c, "kettle", 540, 1480, 400, { reveal: rev(t, tk) }); bubble(c, 790, 1040, 8, prog(t, tk + .25, tk + .5), 3); }

  { name: "Traded", start: 34.05, end: 39.1, draw(c, t) {

    if (t < VO.lost.t - .05) {

/* ======================= COMPOSITE ======================= */
let FRAME = 0;
function render(c, t) {
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = "source-over"; c.filter = "none";
  background(c, t);
  const sc = SCENES.find(s => t >= s.start && t < s.end) || SCENES[SCENES.length - 1];
  c.save(); sc.draw(c, t); c.restore();
  grain(c, FRAME);
}
function renderFrame(f, samples = 1) {
  FRAME = f; const t = f / FPS;
  if (samples <= 1) { render(ctx, t); return; }
  const sc = SCENES.find(s => t >= s.start && t < s.end) || SCENES[0];
  for (let k = 0; k < samples; k++) {
    const tk = Math.max(sc.start, (f - (k / samples) * CONFIG.shutter) / FPS);   // never blend across a hard cut
    render(wctx, tk); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1 / (k + 1); ctx.drawImage(work, 0, 0);
  }
  ctx.globalAlpha = 1;
}

/* ======================= PLAYER ======================= */
const ready = (async () => { await Promise.all(["BCB", "BCBI", "BCL"].map(f => document.fonts.load(`60px ${f}`))); await document.fonts.ready; await loadSprites(); })();
window.REEL = { ready, renderFrame, canvas: cv, FRAMES, FPS, CONFIG };
const $ = id => document.getElementById(id), scrub = $("scrub"), timeEl = $("time"), playBtn = $("play"), mb = $("mb");
scrub.max = FRAMES - 1;
let frame = 0, playing = false, t0 = 0, f0 = 0;
const AUDIO_SRC = "__AUDIO__", snd = AUDIO_SRC.startsWith("data:") ? new Audio(AUDIO_SRC) : null;
const show = f => { frame = Math.max(0, Math.min(FRAMES - 1, f)); renderFrame(frame, mb.checked ? 3 : 1); scrub.value = frame;
  timeEl.textContent = `${(frame / FPS).toFixed(2).padStart(5, "0")} / ${DUR.toFixed(2)}  f${frame}`; };
const loop = now => { if (!playing) return;
  const f = snd ? Math.floor(snd.currentTime * FPS) : f0 + Math.floor((now - t0) / 1000 * FPS);
  if (snd && snd.ended) { snd.currentTime = 0; snd.play(); }
  show(f % FRAMES); requestAnimationFrame(loop); };
const toggle = () => { playing = !playing; playBtn.textContent = playing ? "Pause" : "Play";
  if (playing) { t0 = performance.now(); f0 = frame; if (snd) { snd.currentTime = frame / FPS; snd.play(); } requestAnimationFrame(loop); }
  else if (snd) snd.pause(); };
playBtn.onclick = toggle; $("prev").onclick = () => show(frame - 1); $("next").onclick = () => show(frame + 1);
scrub.oninput = () => { playing = false; playBtn.textContent = "Play"; if (snd) snd.pause(); show(+scrub.value); };
mb.onchange = () => show(frame);
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); toggle(); } if (e.key === "ArrowLeft") show(frame - 1); if (e.key === "ArrowRight") show(frame + 1); });
SCENES.forEach(s => { const d = document.createElement("div"); d.style.width = ((s.end - s.start) / DUR * 100) + "%"; d.textContent = s.name; d.onclick = () => show(Math.round(s.start * FPS)); $("beats").appendChild(d); });
ready.then(() => { if (!window.__EXPORT__) show(0); });
</script>
