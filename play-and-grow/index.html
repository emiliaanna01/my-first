<title>Play &amp; Grow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
/* Layout: a bright "sticker board" lab. Header, then one screen at a time (home, lab, report, teacher). Robu the robot guides every lab. Single light look on purpose. */
:root {
  color-scheme: light;
  --ground: #EEF7F3;
  --paper: #FFFFFF;
  --ink: #17304A;
  --ink-soft: #4C6378;
  --line: #17304A;
  --sun: #F6B12E;
  --teal: #12927F;
  --coral: #EE6A52;
  --lilac: #8A6FDF;
  --sky: #3B8EE0;
  --leaf: #6DB33F;
  --tint-sun: #FFF1D2;
  --tint-teal: #D8F1EC;
  --tint-coral: #FDE2DC;
  --tint-lilac: #ECE6FB;
  --tint-sky: #DDEBFB;
  --tint-leaf: #E5F3DA;
  --good: #1E9E5A;
  --display: "Baloo Da 2", "Hind Siliguri", system-ui, sans-serif;
  --body: "Hind Siliguri", "Baloo Da 2", system-ui, sans-serif;
  --r: 18px;
  --shadow: 4px 4px 0 var(--line);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
  background-image: radial-gradient(circle at 1px 1px, rgba(23,48,74,.08) 1px, transparent 0);
  background-size: 22px 22px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; text-wrap: balance; }
:lang(bn) h1, :lang(bn) h2, :lang(bn) h3 { line-height: 1.35; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.muted { color: var(--ink-soft); }
.small { font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.center { justify-content: center; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-align: left; color: var(--ink); background: none; border: 0; padding: 0; }
.brand svg { width: 44px; height: 44px; flex: none; }
.brand-name { font-family: var(--display); font-weight: 800; font-size: 26px; }
.brand-name small { display: block; font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--ink-soft); letter-spacing: .04em; text-transform: uppercase; margin-top: -2px; }
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--paper); }
.seg button { border: 0; background: transparent; padding: 4px 12px; font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--line); border-radius: 999px; padding: 3px 12px; background: var(--tint-sun); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--line); border-radius: 14px; background: var(--sun); padding: 10px 18px; font-family: var(--display); font-weight: 700; font-size: 18px; box-shadow: var(--shadow); transition: transform .08s, box-shadow .08s; text-decoration: none; color: var(--ink); user-select: none; -webkit-user-select: none; }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--line); }
.btn.alt { background: var(--paper); }
.btn.teal { background: var(--teal); color: #fff; }
.btn.lilac { background: var(--lilac); color: #fff; }
.btn.coral { background: var(--coral); color: #fff; }
.btn.small { font-size: 15px; padding: 6px 12px; border-radius: 10px; box-shadow: 2px 2px 0 var(--line); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.linkish { background: none; border: 0; padding: 0; text-decoration: underline; color: var(--ink-soft); font-size: 14px; }
.panel { background: var(--paper); border: 2px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px; min-width: 0; }

/* Hero */
.hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; align-items: stretch; }
.hero-copy { display: flex; gap: 18px; align-items: center; padding: 8px 4px; }
.hero-copy > div { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.hero-robu { width: 150px; flex: none; }
.hero h1 { font-size: clamp(32px, 5.4vw, 52px); font-weight: 800; }
.hero h1 em { font-style: normal; background: var(--sun); padding: 0 .18em; border-radius: 10px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.hero-copy p { font-size: 18px; max-width: 38ch; }
.who h2 { font-size: 26px; }
.who form { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
label.lbl, .lbl { font-weight: 600; font-size: 14px; display: block; margin-bottom: 4px; }
.field { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--paper); font-size: 17px; }
.ages { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.ages button { border: 2px solid var(--line); background: var(--paper); border-radius: 10px; padding: 6px 0; font-weight: 700; font-family: var(--display); font-size: 18px; }
.ages button[aria-pressed="true"] { background: var(--teal); color: #fff; }
.greet { display: flex; flex-direction: column; gap: 12px; }
.greet h2 { font-size: 30px; }
.starbar { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; }
.star { width: 20px; height: 20px; }
.star path { fill: #E3E8EC; stroke: var(--line); stroke-width: 1.5; }
.star.on path { fill: var(--sun); }

/* Lab grid */
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sec-head h2 { font-size: 28px; }
.acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.act { position: relative; text-align: left; border: 2px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--paper); transition: transform .12s; min-width: 0; }
.act:hover { transform: translateY(-2px) rotate(-.4deg); }
.act .art { height: 96px; border-radius: 12px; border: 2px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.act .art svg { height: 80px; width: auto; }
.act h3 { font-size: 23px; }
.act p { font-size: 14px; color: var(--ink-soft); }
.act .meta { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; }
.act .tag { border: 1.5px solid var(--line); border-radius: 999px; padding: 0 8px; background: var(--paper); }
.act .done-badge { position: absolute; top: -10px; right: 12px; background: var(--good); color: #fff; border: 2px solid var(--line); border-radius: 999px; font-size: 12px; font-weight: 700; padding: 0 10px; }
.act .txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.c-teal { background: var(--tint-teal); } .c-sun { background: var(--tint-sun); } .c-coral { background: var(--tint-coral); }
.c-lilac { background: var(--tint-lilac); } .c-sky { background: var(--tint-sky); } .c-leaf { background: var(--tint-leaf); }
.parents { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.parents div { display: flex; flex-direction: column; gap: 4px; }
.parents strong { font-family: var(--display); font-size: 19px; }
.parents span { font-size: 14px; color: var(--ink-soft); }

/* Lab screen */
.lab-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 20px; border-bottom: 2px solid var(--line); }
.lab-head h2 { font-size: 28px; }
.robu-say { display: flex; gap: 12px; align-items: center; padding: 14px 20px; border-bottom: 2px dashed #C9D6DF; background: var(--tint-lilac); }
.robu-say .mini { width: 64px; height: 64px; flex: none; }
.robu-say p { font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.25; background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 8px 12px; position: relative; min-width: 0; }
.robu-say p::before { content: ""; position: absolute; left: -9px; top: 50%; width: 14px; height: 14px; background: var(--paper); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateY(-50%) rotate(45deg); }
.stage { padding: 22px 20px 28px; display: flex; flex-direction: column; gap: 18px; min-height: 380px; }
.lab-h { font-size: 24px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.pick { border: 2px solid var(--line); border-radius: 14px; background: var(--paper); padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 600; box-shadow: 2px 2px 0 var(--line); text-align: center; }
.pick .em { font-size: 34px; line-height: 1.1; }
.pick[aria-pressed="true"] { background: var(--tint-sun); outline: 3px solid var(--sun); }

/* Drawing + AI */
.pad { position: relative; width: 100%; max-width: 320px; aspect-ratio: 1; border: 3px solid var(--line); border-radius: 16px; background: #fff; overflow: hidden; touch-action: none; }
.pad canvas, .pad video { position: absolute; inset: 0; width: 100%; height: 100%; }
.pad video { object-fit: cover; transform: scaleX(-1); }
.pad .hint { position: absolute; inset: auto 0 10px; text-align: center; color: #A7B6C2; font-size: 14px; pointer-events: none; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { border: 2px solid var(--line); border-radius: 12px; padding: 6px 12px; font-weight: 700; background: var(--paper); display: flex; gap: 6px; align-items: center; }
.tabs button[aria-pressed="true"] { color: #fff; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; }
.shelf { border: 2px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--paper); }
.shelf h4 { margin: 0; font-family: var(--display); font-size: 18px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.thumbs { display: flex; gap: 4px; flex-wrap: wrap; min-height: 44px; }
.thumbs img { width: 40px; height: 40px; border: 1.5px solid #C9D6DF; border-radius: 8px; background: #fff; }
.meter { height: 10px; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--ground); }
.meter i { display: block; height: 100%; background: var(--good); transition: width .3s; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.cbar { display: grid; grid-template-columns: 96px 1fr 48px; gap: 8px; align-items: center; font-weight: 700; }
.cbar .b { height: 26px; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--ground); }
.cbar .b i { display: block; height: 100%; transition: width .25s; }
.cbar .v { text-align: right; font-variant-numeric: tabular-nums; }
.guess { font-family: var(--display); font-size: 30px; font-weight: 800; }
.tip { border: 2px dashed var(--lilac); border-radius: 14px; padding: 10px 12px; background: var(--tint-lilac); font-size: 15px; }
.net { width: 100%; max-width: 520px; height: auto; border: 2px solid var(--line); border-radius: 14px; background: #0F2236; }

/* Code */
.grid-maze { display: grid; gap: 4px; justify-content: center; }
.cell { width: 46px; height: 46px; border-radius: 10px; border: 2px solid var(--line); background: var(--paper); display: grid; place-items: center; }
.cell.wall { background: var(--ink); }
.cell svg { width: 32px; height: 32px; }
.prog { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 52px; padding: 8px; border: 2px dashed var(--ink-soft); border-radius: 12px; background: var(--paper); }
.blk { min-width: 34px; height: 34px; padding: 0 6px; border-radius: 8px; background: var(--sky); color: #fff; display: inline-grid; place-items: center; font-weight: 800; border: 2px solid var(--line); }
.rep { display: inline-flex; gap: 4px; align-items: center; padding: 4px 6px; border: 2px solid var(--line); border-radius: 10px; background: var(--sun); font-weight: 800; }
.rep.open { border-style: dashed; background: var(--tint-sun); }
.rep .blk { background: var(--lilac); }
.blk.now, .rep.now { outline: 3px solid var(--coral); }
.palette { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.palette .arrow { width: 54px; height: 50px; border: 2px solid var(--line); border-radius: 12px; background: var(--tint-sky); font-size: 24px; font-weight: 800; box-shadow: 2px 2px 0 var(--line); }
.stepper { display: inline-flex; align-items: center; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
.stepper button { border: 0; background: var(--tint-sun); width: 34px; height: 46px; font-weight: 800; font-size: 20px; }
.stepper span { min-width: 30px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }

/* Music */
.seq { display: grid; gap: 5px; overflow-x: auto; padding: 4px; }
.seq .lab { font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: flex-end; padding-right: 4px; white-space: nowrap; }
.seq button { width: 100%; min-width: 34px; aspect-ratio: 1; border: 2px solid var(--line); border-radius: 9px; background: var(--paper); }
.seq button.on { box-shadow: inset 0 0 0 40px var(--c); }
.seq button.ghost { box-shadow: inset 0 0 0 40px rgba(23,48,74,.18); }
.seq button.beat { transform: scale(1.08); }
.seq .col-now { outline: 3px solid var(--coral); }
.dance { width: 90px; height: 90px; transition: transform .1s; }
.dance.bop { transform: translateY(-8px) rotate(-6deg); }

/* Story */
.story { font-size: 19px; line-height: 1.65; max-width: 62ch; }
.story p + p { margin-top: 10px; }
.story h3 { font-size: 28px; margin-bottom: 8px; }
.words { display: flex; gap: 8px; flex-wrap: wrap; }
.word { border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; background: var(--tint-sky); font-size: 15px; }
.word b { font-family: var(--display); }
.thinking { display: flex; gap: 6px; align-items: center; font-weight: 600; color: var(--ink-soft); }
.thinking i { width: 10px; height: 10px; border-radius: 50%; background: var(--lilac); animation: blink 1s infinite; }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .2; } }

/* Balance */
.scale { width: 100%; max-width: 520px; height: auto; margin: 0 auto; display: block; }
.weights { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.weight { border: 2px solid var(--line); border-radius: 10px 10px 14px 14px; background: var(--sun); font-family: var(--display); font-weight: 800; font-size: 20px; min-width: 52px; height: 48px; box-shadow: 2px 2px 0 var(--line); }
.placed { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; min-height: 40px; }
.placed button { border: 2px solid var(--line); border-radius: 8px; background: var(--tint-sun); font-weight: 800; padding: 2px 8px; }
input[type=range] { width: 100%; max-width: 360px; accent-color: var(--lilac); height: 36px; }
.xval { font-family: var(--display); font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* Garden */
.garden { width: 100%; height: auto; border: 2px solid var(--line); border-radius: 16px; display: block; }
.breathe { width: 170px; height: 170px; border-radius: 50%; border: 3px solid var(--line); background: var(--tint-teal); font-family: var(--display); font-weight: 800; font-size: 20px; position: relative; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: var(--shadow); }
.breathe svg { position: absolute; inset: -3px; width: calc(100% + 6px); height: calc(100% + 6px); pointer-events: none; transform: rotate(-90deg); }
.breathe span { position: relative; }

.result { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 20px 0; }
.result .star { width: 52px; height: 52px; }
.result h3 { font-size: 34px; }

/* Report */
.report { display: grid; grid-template-columns: 1.25fr 1fr; gap: 20px; }
.report-card { display: flex; flex-direction: column; gap: 16px; }
.rc-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; border-bottom: 2px dashed var(--ink-soft); padding-bottom: 12px; }
.rc-head h2 { font-size: 32px; }
.skill { display: grid; grid-template-columns: 150px 1fr 44px; gap: 10px; align-items: center; font-weight: 600; }
.skill .bar { height: 16px; border: 2px solid var(--line); border-radius: 999px; background: var(--ground); overflow: hidden; }
.skill .bar i { display: block; height: 100%; }
.skill .val { text-align: right; font-variant-numeric: tabular-nums; }
.skill.none { opacity: .5; }
.made { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.made li { border-left: 4px solid var(--lilac); padding: 2px 0 2px 10px; }
.note { border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--tint-sun); }
.note strong { font-family: var(--display); font-size: 19px; display: block; }
.side { display: flex; flex-direction: column; gap: 16px; }
.side h3 { font-size: 24px; }
.form { display: flex; flex-direction: column; gap: 12px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 4px; width: 18px; height: 18px; flex: none; }
.msg { border-radius: 12px; padding: 10px 12px; border: 2px solid var(--line); background: var(--tint-teal); }
.msg.err { background: var(--tint-coral); }

/* Teacher */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.kpi { border: 2px solid var(--line); border-radius: 14px; padding: 12px; background: var(--paper); }
.kpi b { font-family: var(--display); font-size: 34px; display: block; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #C9D6DF; white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
td.num { font-variant-numeric: tabular-nums; }
.empty { padding: 18px; border: 2px dashed var(--ink-soft); border-radius: 14px; color: var(--ink-soft); text-align: center; }
footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); }

@keyframes pop { 0% { transform: scale(.6); opacity: .3; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
.pop { animation: pop .35s ease-out; }
@keyframes float { 50% { transform: translateY(-6px); } }
.hero-robu { animation: float 3s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .pop, .hero-robu, .thinking i { animation: none; } .act:hover { transform: none; } .dance.bop { transform: none; } }

@media (max-width: 860px) {
  .hero, .report, .cols { grid-template-columns: 1fr; }
  .acts { grid-template-columns: repeat(2, 1fr); }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .pick-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 560px) {
  .acts, .parents { grid-template-columns: 1fr; }
  .hero-robu { width: 96px; }
  .skill { grid-template-columns: 120px 1fr 40px; font-size: 14px; }
  .cell { width: 38px; height: 38px; }
  .panel { padding: 16px; }
  .stage { padding: 18px 14px 24px; }
  .robu-say p { font-size: 17px; }
}
</style>

<div class="wrap">
  <header class="top">
    <button class="brand" id="homeBtn" aria-label="Home">
      <svg viewBox="0 0 44 44" aria-hidden="true">
        <circle cx="22" cy="22" r="20" fill="#F6B12E" stroke="#17304A" stroke-width="2.5"/>
        <path d="M22 33V20" stroke="#17304A" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M22 23c0-5 4-8 9-8 0 5-4 8-9 8z" fill="#12927F" stroke="#17304A" stroke-width="2"/>
        <path d="M22 26c0-4-3-7-8-7 0 4 3 7 8 7z" fill="#6DB33F" stroke="#17304A" stroke-width="2"/>
      </svg>
      <span class="brand-name"><span data-t="brand"></span><small data-t="brandSub"></small></span>
    </button>
    <div class="top-actions">
      <span class="chip" id="playerChip" hidden></span>
      <div class="seg" role="group" aria-label="Language">
        <button id="langEn" aria-pressed="true">English</button>
        <button id="langBn" aria-pressed="false">বাংলা</button>
      </div>
    </div>
  </header>

  <!-- HOME -->
  <main id="viewHome" class="wrap">
    <section class="hero">
      <div class="hero-copy">
        <div class="hero-robu" id="heroRobu"></div>
        <div>
          <h1 data-t="heroTitle"></h1>
          <p data-t="heroText"></p>
        </div>
      </div>
      <div class="panel who" id="whoPanel">
        <h2 data-t="whoTitle"></h2>
        <form id="whoForm" novalidate>
          <div>

/* ==========================================================
   LAB 2: Code Robu (sequences and loops)
   ========================================================== */
const LEVELS = [
  { g: ["R****"], par: 2 },
  { g: ["....*", "...*.", "..*..", ".*...", "R...."], par: 3 },
  { g: ["R**....", "..***..", "....***", "......*"], par: 4 },
  { g: ["R***", "*..*", "*..*", "****"], par: 8 },
  { g: ["R***#", "###*#", "#***#", "#*###", "#****"], par: 10 },
  { g: ["R****", "#...*", "*##.*", "*...*", "*****"], par: 8 }
];
const GEM = '<svg viewBox="0 0 32 32"><path d="M8 6h16l6 8-14 14L2 14z" fill="#3B8EE0" stroke="#17304A" stroke-width="2"/><path d="M2 14h28M12 6l-3 8 7 14 7-14-3-8" stroke="#17304A" stroke-width="1.4" fill="none"/></svg>';
const ROBOT = '<svg viewBox="0 0 34 34"><rect x="6" y="9" width="22" height="18" rx="6" fill="#8A6FDF" stroke="#17304A" stroke-width="2.2"/><rect x="9" y="12" width="16" height="11" rx="4" fill="#ECE6FB"/><circle cx="14" cy="17" r="2.2" fill="#17304A"/><circle cx="20" cy="17" r="2.2" fill="#17304A"/><path d="M17 9V5" stroke="#17304A" stroke-width="2.2"/><circle cx="17" cy="4" r="2.2" fill="#F6B12E" stroke="#17304A" stroke-width="1.6"/></svg>';
const DIRS = { "↑": [-1, 0], "↓": [1, 0], "←": [0, -1], "→": [0, 1] };
const countBlocks = prog => prog.reduce((s, n) => s + (n.rep ? 1 + n.body.length : 1), 0);
const flatten = prog => prog.flatMap((n, i) => n.rep ? Array.from({ length: n.rep }, () => n.body.map(d => ({ d, i }))).flat() : [{ d: n.d, i }]);
function runCode(stage, band, done) {
  const levels = band === 0 ? LEVELS.slice(0, 4) : LEVELS;
  let lv = 0, results = [], loops = 0, timer = null;
  cleanup = () => clearTimeout(timer);
  const finish = () => {
    const sum = results.reduce((s, x) => s + x, 0);
    done({ pct: sum / (levels.length * 3) * 100, stars: Math.max(results.length ? 1 : 0, Math.round(sum / levels.length)), detail: { solved: results.length, of: levels.length, loops }, summary: t("levelN", { n: num(results.length), t: num(levels.length) }) });
  };
  const level = () => {
    const L = levels[lv], g = L.g, par = L.par + (band === 0 ? 2 : 0);
    let start; const gems0 = new Set();
    g.forEach((r, y) => [...r].forEach((c, x) => { if (c === "R") start = [y, x]; if (c === "*") gems0.add(y + "," + x); }));
    let pos = start.slice(), gems = new Set(gems0), prog = [], open = null, n = 2, running = false;
    robu("happy", lv === 1 ? t("codeLoop") : t("codeHello"));
    stage.innerHTML = `<div class="row" style="justify-content:space-between"><span class="chip">${esc(t("levelN", { n: num(lv + 1), t: num(levels.length) }))}</span><span class="small muted">${esc(t("par", { n: num(par) }))}</span></div>
      <div class="cols"><div class="col" style="align-items:center"><div class="grid-maze" id="mz" style="grid-template-columns:repeat(${g[0].length}, auto)"></div></div>
      <div class="col">
        <div class="palette">${Object.keys(DIRS).map(d => `<button class="arrow" data-d="${d}" aria-label="${d}">${d}</button>`).join("")}</div>
        <div class="palette"><button class="btn small" id="rep">${esc(t("repeat"))}</button><span class="stepper"><button id="nm" aria-label="fewer">−</button><span id="nv">${n}</span><button id="np" aria-label="more">+</button></span><button class="btn alt small" id="endRep" hidden>${esc(t("endRepeat"))}</button></div>
        <div class="prog" id="prog"></div>
        <p class="small muted" id="bc"></p>
        <div class="row"><button class="btn teal" id="run">${esc(t("run"))}</button><button class="btn alt small" id="undo">${esc(t("undo"))}</button><button class="btn alt small" id="clr">${esc(t("clear"))}</button><button class="linkish" id="fin">${esc(t("finish"))}</button></div>
      </div></div>`;
    const paint = () => {
      $("#mz").innerHTML = g.map((r, y) => [...r].map((c, x) => {
        const isR = pos[0] === y && pos[1] === x;
        return `<div class="cell${c === "#" ? " wall" : ""}">${isR ? ROBOT : gems.has(y + "," + x) ? GEM : ""}</div>`;
      }).join("")).join("");
    };
    const drawProg = (cur = -1) => {
      $("#prog").innerHTML = prog.map((nd, i) => nd.rep
        ? `<span class="rep${nd === open ? " open" : ""}${i === cur ? " now" : ""}">×${nd.rep} [ ${nd.body.map(d => `<span class="blk">${d}</span>`).join("")} ]</span>`
        : `<span class="blk${i === cur ? " now" : ""}">${nd.d}</span>`).join("") || `<span class="small muted">…</span>`;
      $("#bc").textContent = t("blocks", { n: num(countBlocks(prog)) });
      $("#endRep").hidden = !open; $("#rep").disabled = !!open;
    };
    paint(); drawProg();
    stage.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
      if (running || countBlocks(prog) >= 30) return;
      tone(520, .06, "square", .05);
      if (open) open.body.push(b.dataset.d); else prog.push({ d: b.dataset.d });
      drawProg();
    });
    $("#nm").onclick = () => { n = Math.max(2, n - 1); $("#nv").textContent = n; if (open) { open.rep = n; drawProg(); } };
    $("#np").onclick = () => { n = Math.min(9, n + 1); $("#nv").textContent = n; if (open) { open.rep = n; drawProg(); } };
    $("#rep").onclick = () => { if (running) return; open = { rep: n, body: [] }; prog.push(open); drawProg(); };
    $("#endRep").onclick = () => { if (open && !open.body.length) prog.pop(); open = null; drawProg(); };
    $("#undo").onclick = () => {
      if (running) return;
      if (open) { if (open.body.length) open.body.pop(); else { prog.pop(); open = null; } }
      else { const last = prog[prog.length - 1]; if (last?.rep) { open = last; if (last.body.length) last.body.pop(); } else prog.pop(); }
      drawProg();
    };
    $("#clr").onclick = () => { if (!running) { prog = []; open = null; drawProg(); } };
    $("#fin").onclick = () => { if (!running) finish(); };
    $("#run").onclick = () => {
      if (running || !prog.length) return;
      open = null; running = true; pos = start.slice(); gems = new Set(gems0); paint(); drawProg();
      const steps = flatten(prog); let k = 0;
      const tick = () => {
        if (k >= steps.length) {
          running = false;
          robu("think", t("left", { n: num(gems.size) })); drawProg(); return;
        }
        const { d, i } = steps[k]; drawProg(i);
        const [dy, dx] = DIRS[d], ny = pos[0] + dy, nx = pos[1] + dx;
        if (ny < 0 || nx < 0 || ny >= g.length || nx >= g[0].length || g[ny][nx] === "#") {
          running = false; buzz(); robu("oops", t("bump"));
          timer = later(() => { pos = start.slice(); gems = new Set(gems0); paint(); drawProg(); }, 800); return;
        }
        pos = [ny, nx];
        if (gems.delete(ny + "," + nx)) tone(880 + (gems0.size - gems.size) * 40, .12);
        paint();
        if (!gems.size) {
          running = false; chime();
          const used = countBlocks(prog), st = used <= par ? 3 : used <= par + 3 ? 2 : 1;
          if (prog.some(nd => nd.rep)) loops++;
          results[lv] = Math.max(results[lv] || 0, st);
          robu("wow", t("allGems"));
          timer = later(() => {
            stage.innerHTML = `<div class="result pop"><div class="starbar">${stars(st)}</div><h3>${esc(t("allGems"))}</h3><p class="muted">${esc(t("blocks", { n: num(used) }))} · ${esc(t("par", { n: num(par) }))}</p>
              <div class="row center"><button class="btn teal" id="nx">${esc(lv + 1 < levels.length ? t("nextLevel") : t("finish"))}</button><button class="btn alt small" id="rt">${esc(t("again"))}</button></div></div>`;
            $("#nx").onclick = () => { lv++; if (lv >= levels.length) { robu("wow", t("codeDone")); finish(); } else level(); };
            $("#rt").onclick = level;
          }, 700);
          return;
        }
        k++; timer = later(tick, reduced ? 120 : 330);
      };
      tick();
    };
  };
  level();
}

/* ==========================================================
   LAB 5: Balance It (equations as a balance scale)
   ========================================================== */
function mathPuzzle(band) {
  if (band === 0) { const v = rnd(5, 20); return { kind: "w", left: String(v), value: v, weights: [1, 2, 5, 10] }; }
  if (band === 1) {
    const k = rnd(0, 2);
    if (k === 0) { const a = rnd(3, 9), b = rnd(3, 9); return { kind: "w", left: `${a} × ${b}`, value: a * b, weights: [1, 2, 5, 10, 20] }; }
    if (k === 1) { const a = rnd(15, 45), b = rnd(8, 30); return { kind: "w", left: `${a} + ${b}`, value: a + b, weights: [1, 2, 5, 10, 20] }; }
    const a = rnd(40, 90), b = rnd(10, 35); return { kind: "w", left: `${a} − ${b}`, value: a - b, weights: [1, 2, 5, 10, 20] };
  }
  const x = rnd(2, 12), k = rnd(0, 2);
  if (k === 0) { const a = rnd(2, 5), b = rnd(1, 15); return { kind: "x", expr: `${a}x + ${b}`, f: v => a * v + b, right: a * x + b, x }; }
  if (k === 1) { const a = rnd(2, 4), b = rnd(1, 6); return { kind: "x", expr: `${a}(x + ${b})`, f: v => a * (v + b), right: a * (x + b), x }; }
  const a = rnd(2, 6), b = rnd(10, 30); return { kind: "x", expr: `${a}x − ${b}`, f: v => a * v - b, right: a * x - b, x };
}
function runMath(stage, band, done) {
  const TOTAL = 6; let i = 0, solved = 0, raf = null, angle = 0;
  cleanup = () => cancelAnimationFrame(raf);
  robu("happy", t("mathHello"));
  const next = () => {
    if (i >= TOTAL) return done({ pct: solved / TOTAL * 100, stars: solved >= 6 ? 3 : solved >= 4 ? 2 : 1, detail: { solved, of: TOTAL }, summary: `${num(solved)} / ${num(TOTAL)}` });
    const pz = mathPuzzle(band); let placed = [], xv = 0, won = false;
    robu("think", pz.kind === "x" ? t("mathSlide") : t("mathTap"));
    stage.innerHTML = `<div class="row" style="justify-content:space-between"><span class="chip">${esc(t("puzzleN", { n: num(i + 1), t: num(TOTAL) }))}</span><button class="linkish" id="skip">${esc(t("skip"))}</button></div>
      <svg class="scale" viewBox="0 0 360 230" id="sc"></svg>
      ${pz.kind === "x" ? `<div class="col" style="align-items:center"><span class="xval" id="xv">x = 0</span><input type="range" id="xr" min="0" max="20" value="0" aria-label="x"></div>`
        : `<div class="col" style="align-items:center"><div class="weights">${pz.weights.map(w => `<button class="weight" data-w="${w}">${num(w)}</button>`).join("")}</div><p class="small muted" id="rs"></p><div class="placed" id="placed"></div></div>`}`;
    const L = () => pz.kind === "x" ? pz.f(xv) : pz.value;
    const R = () => pz.kind === "x" ? pz.right : placed.reduce((s, w) => s + w, 0);
    const draw = () => {
      const l = L(), r = R(), diff = r - l, scaleBy = Math.max(4, Math.abs(l) * .25);
      const targetA = diff === 0 ? 0 : 18 * Math.tanh(diff / scaleBy);
      angle += (targetA - angle) * (reduced ? 1 : .15);
      const rad = angle * Math.PI / 180, cx = 180, cy = 92, arm = 130;
      const lx = cx - arm * Math.cos(rad), ly = cy - arm * Math.sin(rad), rx = cx + arm * Math.cos(rad), ry = cy + arm * Math.sin(rad);
      const leftTxt = pz.kind === "x" ? pz.expr : pz.left;
      const leftSub = pz.kind === "x" ? `= ${l}` : "";
      const pan = (x, y, label, sub, fill) => { const w = Math.max(56, label.length * 14 + 20); return `<line x1="${x}" y1="${y}" x2="${x}" y2="${y + 12}" stroke="#17304A" stroke-width="3"/>
        <rect x="${x - w / 2}" y="${y + 12}" width="${w}" height="38" rx="9" fill="${fill}" stroke="#17304A" stroke-width="3"/>
        <text x="${x}" y="${y + 39}" text-anchor="middle" font-family="Baloo Da 2,sans-serif" font-weight="800" font-size="22" fill="#17304A">${esc(label)}</text>
        <path d="M${x - 52} ${y + 52}h104l-12 16h-80z" fill="#fff" stroke="#17304A" stroke-width="3"/>
        ${sub ? `<text x="${x}" y="${y + 88}" text-anchor="middle" font-family="Hind Siliguri,sans-serif" font-weight="600" font-size="15" fill="#4C6378">${esc(sub)}</text>` : ""}`; };
      $("#sc").innerHTML = `<path d="M${cx} ${cy}l-26 120h52z" fill="${won ? "#6DB33F" : "#D8F1EC"}" stroke="#17304A" stroke-width="3"/>
        <rect x="${cx - 70}" y="210" width="140" height="10" rx="5" fill="#17304A"/>
        <line x1="${lx}" y1="${ly}" x2="${rx}" y2="${ry}" stroke="#17304A" stroke-width="9" stroke-linecap="round"/>
        <circle cx="${cx}" cy="${cy}" r="8" fill="#F6B12E" stroke="#17304A" stroke-width="3"/>
        ${pan(lx, ly, leftTxt, leftSub, "#FFF1D2")}${pan(rx, ry, pz.kind === "x" ? String(r) : (placed.length ? String(r) : "?"), "", "#DDEBFB")}`;
      if (Math.abs(targetA - angle) > .05) raf = requestAnimationFrame(draw);

      else $("#xv").textContent = `x = ${num(xv)}`;
      if (!won && L() === R()) {

        later(() => { i++; next(); }, 1500);
      }
    };

    else stage.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { if (!won && placed.length < 14) { placed.push(+b.dataset.w); tone(440, .06, "sine", .08); update(); } });
    $("#skip").onclick = () => { if (!won) { i++; next(); } };
    update();
  };
  next();
}

/* ==========================================================
   LAB 6: Calm Garden (hold-to-breathe, each calm breath grows a flower)
   ========================================================== */
function runCalm(stage, band, done) {
  const TOTAL = 5, IN = 3.5;
  let garden = store.get("garden_" + player.id, []), today = 0, holding = false, held0 = 0, raf = null, cool = false, growing = null, timer = null;
  cleanup = () => { cancelAnimationFrame(raf); clearTimeout(timer); };
  robu("happy", t("calmHello"));
  stage.innerHTML = `<canvas class="garden" id="gd" width="760" height="300"></canvas>
    <div class="row center" style="gap:24px"><button class="breathe" id="hb"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="none" stroke="#12927F" stroke-width="5" stroke-dasharray="301.6" stroke-dashoffset="301.6" id="ring" stroke-linecap="round"/></svg><span id="hbt">${esc(t("holdIn"))}</span></button>
    <div class="col"><span class="chip" id="bn">${esc(t("breathN", { n: num(0), t: num(TOTAL) }))}</span><button class="linkish" id="fin" style="text-align:left">${esc(t("finish"))}</button></div></div>`;
  const cv = $("#gd"), ctx = cv.getContext("2d"), W = cv.width, Hh = cv.height, ring = $("#ring"), hb = $("#hb");
  const flower = (f, g) => {
    const base = Hh - 40, top = base - f.h * g;
    ctx.strokeStyle = "#3E7D2A"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(f.x, base); ctx.quadraticCurveTo(f.x + f.bend, (base + top) / 2, f.x, top); ctx.stroke();
    if (g > .4) { ctx.fillStyle = "#6DB33F"; ctx.beginPath(); ctx.ellipse(f.x + 10, base - f.h * .35 * g, 10 * g, 5 * g, -.5, 0, 7); ctx.fill(); }
    const pr = Math.max(0, (g - .5) * 2) * f.r;
    if (pr > 0) {
      for (let k = 0; k < f.petals; k++) { const a = k / f.petals * Math.PI * 2; ctx.fillStyle = `hsl(${f.hue} 75% 62%)`; ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * pr * .9, top + Math.sin(a) * pr * .9, pr * .62, 0, 7); ctx.fill(); }
      ctx.fillStyle = "#F6B12E"; ctx.beginPath(); ctx.arc(f.x, top, pr * .5, 0, 7); ctx.fill();
    }
  };
  const paint = (seed = 0) => {
    const sky = ctx.createLinearGradient(0, 0, 0, Hh); sky.addColorStop(0, "#DDEBFB"); sky.addColorStop(1, "#EEF7F3");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, Hh);
    ctx.fillStyle = "#FFF1D2"; ctx.beginPath(); ctx.arc(W - 70, 60, 30, 0, 7); ctx.fill();
    ctx.fillStyle = "#8CC76A"; ctx.fillRect(0, Hh - 40, W, 40);
    garden.forEach(f => flower(f, 1));
    if (growing) flower(growing.f, growing.g);
    if (holding) { ctx.fillStyle = "rgba(18,146,127,.15)"; ctx.beginPath(); ctx.arc(W / 2, Hh - 40, 30 + seed * 90, Math.PI, 0); ctx.fill(); }
  };
  paint();
  const loopHold = now => {
    if (!holding) return;
    const s = (now - held0) / 1000, p = Math.min(1, s / IN);
    ring.setAttribute("stroke-dashoffset", 301.6 * (1 - p)); paint(p);
    raf = requestAnimationFrame(loopHold);
  };
  const press = e => { e.preventDefault(); if (cool || holding || today >= TOTAL) return; audio(); holding = true; held0 = performance.now(); $("#hbt").textContent = t("holdIn"); raf = requestAnimationFrame(loopHold); };
  const release = () => {
    if (!holding) return; holding = false; cancelAnimationFrame(raf);
    const s = (performance.now() - held0) / 1000;
    ring.setAttribute("stroke-dashoffset", 301.6);
    if (s < 2.6) { robu("think", t("tooShort")); paint(); return; }
    today++; $("#bn").textContent = t("breathN", { n: num(today), t: num(TOTAL) });
    const f = { x: 40 + Math.random() * (W - 80), h: 70 + Math.random() * 120, r: 12 + Math.random() * 10, hue: [0, 20, 280, 320, 200, 45][rnd(0, 5)], petals: rnd(5, 8), bend: rnd(-14, 14) };
    growing = { f, g: 0 }; chime(); robu("wow", t("bloom")); cool = true; $("#hbt").textContent = t("outNow");
    const t0 = performance.now();
    const grow = now => { growing.g = Math.min(1, (now - t0) / (reduced ? 200 : 1400)); paint(); if (growing.g < 1) raf = requestAnimationFrame(grow); else { garden.push(f); if (garden.length > 60) garden.shift(); store.set("garden_" + player.id, garden); growing = null; } };
    raf = requestAnimationFrame(grow);
    timer = later(() => { cool = false; $("#hbt").textContent = t("holdIn"); if (today >= TOTAL) finish(); else robu("happy", t("calmHello")); }, 4000);
  };
  hb.addEventListener("pointerdown", press); hb.addEventListener("pointerup", release); hb.addEventListener("pointerleave", release); hb.addEventListener("pointercancel", release);
  hb.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) press(e); });
  hb.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") release(); });
  const finish = () => done({ pct: today / TOTAL * 100, stars: today >= 5 ? 3 : today >= 3 ? 2 : 1, detail: { breaths: today }, summary: t("gardenDone", { n: num(today) }) });
  $("#fin").onclick = finish;
}

/* ---------- Report card ---------- */
function analyse(p) {
  const played = ACTS.filter(a => p.results[a.id]).map(a => ({ id: a.id, pct: p.results[a.id].pct }));
  const byHigh = played.slice().sort((a, b) => b.pct - a.pct);
  const strong = byHigh[0] || null;
  const grow = played.length >= 2 ? byHigh[byHigh.length - 1] : null;
  return { played, strong, grow: grow && grow.id !== strong?.id ? grow : null };
}
function madeLines(p) {
  const out = [];
  ACTS.forEach(a => {
    const r = p.results[a.id]; if (!r) return; const d = r.detail || {};
    if (a.id === "ai") out.push(t(d.tests ? "made_ai" : "made_ai0", { labels: (d.labels || []).join(" / "), ex: num(d.examples || 0), r: num(d.right || 0), n: num(d.tests || 0) }));
    if (a.id === "code") out.push(t("made_code", { n: num(d.solved || 0), loops: num(d.loops || 0) }));
    if (a.id === "music") out.push(t("made_music", { notes: num(d.notes || 0), c: num(d.challenges || 0) }));
    if (a.id === "story") out.push(t("made_story", { title: d.title || "" }));
    if (a.id === "math") out.push(t("made_math", { n: num(d.solved || 0), t: num(d.of || 6) }));
    if (a.id === "calm") out.push(t("made_calm", { n: num(d.breaths || 0) }));
  });
  return out;
}
function reportText() {
  const a = analyse(player);
  const lines = [`${t("rcLabel")}: ${player.name} (${t("kidAge")} ${num(player.age)})`];
  madeLines(player).forEach(l => lines.push("• " + l));
  if (a.strong) lines.push(t("strongTitle", { skill: t("sk_" + a.strong.id) }));
  if (a.grow) lines.push(t("growTitle", { skill: t("sk_" + a.grow.id) }) + " → " + PROG[lang][a.grow.id]);
  lines.push(ACADEMY.name + " · " + ACADEMY.area);
  return lines.join("\n");
}
function openReport() {
  if (!player) return goHome();
  show("viewReport"); applyText();
  const a = analyse(player);
  $("#rcName").textContent = player.name;
  $("#rcMeta").textContent = t("rcMeta", { age: num(player.age), date: new Date().toLocaleDateString(lang === "bn" ? "bn-BD" : "en-GB", { day: "numeric", month: "long", year: "numeric" }) });
  document.querySelector('[data-t="rcMade"]').textContent = t("rcMade", { name: player.name });
  $("#rcSkills").innerHTML = ACTS.map(x => {
    const r = player.results[x.id];
    return `<div class="skill${r ? "" : " none"}"><span>${esc(t("sk_" + x.id))}</span><span class="bar"><i style="width:${r ? r.pct : 0}%;background:${SKILL_COLOR[x.id]}"></i></span><span class="val small">${r ? num(r.pct) + "%" : "–"}</span></div>`;
  }).join("") + (a.played.length < 6 ? `<p class="small muted">${esc(ACTS.filter(x => !player.results[x.id]).map(x => t("sk_" + x.id)).join(", "))}: ${esc(t("notPlayed"))}</p>` : "");
  $("#rcMadeList").innerHTML = madeLines(player).map(l => `<li>${esc(l)}</li>`).join("");
  $("#rcStrength").hidden = !a.strong;
  $("#rcStrength").innerHTML = a.strong ? `<strong>${esc(t("strongTitle", { skill: t("sk_" + a.strong.id) }))}</strong>${esc(t("strongText", { name: player.name }))}` : "";
  $("#rcGrow").innerHTML = a.grow ? `<strong>${esc(t("growTitle", { skill: t("sk_" + a.grow.id) }))}</strong>${esc(t("growText", { prog: PROG[lang][a.grow.id] }))}` : esc(t("growNone"));
  $("#waShare").href = "https://wa.me/?text=" + encodeURIComponent(reportText());
  $("#copyFallback").hidden = true;
  const lead = store.get("leads", []).find(l => l.sessionId === player.id);
  $("#demoForm").hidden = !!lead; $("#demoDone").hidden = !lead;
  if (lead) showDemoDone(lead, lead.savedToDb);
  $("#demoErr").hidden = true;
}
$("#copyReport").onclick = async () => {
  const txt = reportText();
  try { await navigator.clipboard.writeText(txt); $("#copyReport").textContent = t("copied"); setTimeout(() => $("#copyReport").textContent = t("copy"), 1500); }
  catch { const f = $("#copyFallback"); f.hidden = false; f.value = txt; f.focus(); f.select(); }
};
$("#rcMore").onclick = goHome;
$("#demoForm").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("#pName").value.trim(), phone = $("#pPhone").value.trim(), time = $("#pTime").value, ok = $("#pConsent").checked;
  const err = m => { $("#demoErr").hidden = false; $("#demoErr").textContent = m; };
  if (!name) return err(t("errPName"));
  if (phone.replace(/\D/g, "").length < 10) return err(t("errPhone"));
  if (!ok) return err(t("errConsent"));
  const a = analyse(player);
  const lead = { id: uid(), sessionId: player.id, childName: player.name, childAge: player.age, parentName: name, phone, time, strongest: a.strong?.id || "", practise: a.grow?.id || "", lang, consent: true, createdAt: Date.now(), savedToDb: false };
  if (db) { try { const { savedToDb, ...body } = lead; await db.doc("leads/" + lead.id).set(body); lead.savedToDb = true; } catch {} }
  const leads = store.get("leads", []); leads.push(lead); store.set("leads", leads);
  $("#demoForm").hidden = true; $("#demoDone").hidden = false;
  showDemoDone(lead, lead.savedToDb);
});
const timeKey = v => "t" + (v || "afternoon")[0].toUpperCase() + (v || "afternoon").slice(1);
function showDemoDone(lead, inDb) {
  const waText = `Free demo class request\nChild: ${lead.childName} (${lead.childAge})\nParent: ${lead.parentName}\nPhone: ${lead.phone}\nBest time: ${T.en[timeKey(lead.time)]}`;
  let html = `<p class="msg">${esc(inDb ? t("demoSaved") : t("demoLocal"))}</p>`;
  if (!inDb) html += ACADEMY.whatsapp
    ? `<p class="small">${esc(t("demoWa"))}</p><a class="btn teal small" target="_blank" rel="noopener" href="https://wa.me/${ACADEMY.whatsapp}?text=${encodeURIComponent(waText)}">${esc(t("sendWa"))}</a>`
    : `<p class="small muted">${esc(t("demoShow"))}</p>`;
  $("#demoDone").innerHTML = html;
}

/* ---------- Who's playing ---------- */
$("#whoForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("#kidName").value.trim();
  const err = m => { $("#whoErr").hidden = false; $("#whoErr").textContent = m; };
  if (!name) return err(t("errName"));
  if (!pickedAge) return err(t("errAge"));
  $("#whoErr").hidden = true;
  player = { v2: true, id: uid(), name, age: pickedAge, band: bandOf(pickedAge), lang, startedAt: Date.now(), updatedAt: Date.now(), results: {} };
  savePlayer();
  $("#kidName").value = ""; pickedAge = null;
  renderHome();

$("#newPlayer").onclick = () => { player = null; store.set("player", null); $("#pName").value = ""; $("#pPhone").value = ""; $("#pConsent").checked = false; renderHome(); $("#kidName").focus(); };
$("#toReport").onclick = openReport;
$("#homeBtn").onclick = goHome;
$("#actBack").onclick = goHome;
$("#tBack").onclick = goHome;
$("#langEn").onclick = () => setLang("en");
$("#langBn").onclick = () => setLang("bn");
function setLang(l) {
  lang = l; store.set("lang", l);
  if (!$("#viewReport").hidden) openReport();
  else if (!$("#viewTeacher").hidden) openTeacher();
  else if (!$("#viewAct").hidden) applyText();
  else renderHome();
}

/* ---------- Teacher dashboard ---------- */
let unsubs = [];
function openTeacher() {
  show("viewTeacher"); applyText();
  unsubs.forEach(u => u()); unsubs = [];
  const local = { sessions: Object.values(store.get("sessions", {})).filter(s => s.v2), leads: store.get("leads", []) };
  if (db && isOwner) {
    $("#tSource").textContent = t("tSrcDb"); $("#tClearRow").hidden = true;
    const data = { sessions: [], leads: [] };
    unsubs.push(db.collection("sessions").onSnapshot(s => { data.sessions = s.docs.map(d => d.data()).filter(x => x.v2); drawTeacher(data); }, () => drawTeacher(local)));
    unsubs.push(db.collection("leads").onSnapshot(s => { data.leads = s.docs.map(d => d.data()); drawTeacher(data); }, () => {}));
    cleanup = () => { unsubs.forEach(u => u()); unsubs = []; };
    drawTeacher(data);
  } else { $("#tSource").textContent = t("tSrcLocal"); $("#tClearRow").hidden = false; drawTeacher(local); }
}
function drawTeacher({ sessions, leads }) {
  sessions = sessions.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  leads = leads.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const games = sessions.reduce((s, p) => s + Object.keys(p.results || {}).length, 0);
  const tally = {};
  sessions.forEach(p => { const a = analyse({ results: p.results || {} }); if (a.strong) tally[a.strong.id] = (tally[a.strong.id] || 0) + 1; });
  const top = Object.entries(tally).sort((a, b) => b[1] - a[1])[0];
  $("#tKpis").innerHTML = [[num(sessions.length), t("kPlayers")], [num(games), t("kGames")], [num(leads.length), t("kLeads")], [top ? esc(t("sk_" + top[0])) : "–", t("kTop")]]
    .map(([v, l], i) => `<div class="kpi"><b style="${i === 3 ? "font-size:22px;line-height:1.2" : ""}">${v}</b><span>${esc(l)}</span></div>`).join("");
  const when = ms => ms ? new Date(ms).toLocaleString(lang === "bn" ? "bn-BD" : "en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
  const sk = id => id && T.en["sk_" + id] ? esc(t("sk_" + id)) : "–";
  $("#tLeads").innerHTML = leads.length ? `<table><thead><tr><th>${t("colWhen")}</th><th>${t("colParent")}</th><th>${t("colPhone")}</th><th>${t("colTime")}</th><th>${t("colChild")}</th><th>${t("colAge")}</th><th>${t("colStrong")}</th><th>${t("colGrow")}</th></tr></thead><tbody>${
    leads.map(l => `<tr><td>${esc(when(l.createdAt))}</td><td>${esc(l.parentName)}</td><td class="num">${esc(l.phone)}</td><td>${esc(t(timeKey(l.time)))}</td><td>${esc(l.childName)}</td><td class="num">${num(l.childAge)}</td><td>${sk(l.strongest)}</td><td>${sk(l.practise)}</td></tr>`).join("")}</tbody></table>`
    : `<div class="empty">${esc(t("noLeads"))}</div>`;
  $("#tSessions").innerHTML = sessions.length ? `<table><thead><tr><th>${t("colWhen")}</th><th>${t("colChild")}</th><th>${t("colAge")}</th><th>${t("colGames")}</th>${ACTS.map(a => `<th>${esc(t("sk_" + a.id))}</th>`).join("")}</tr></thead><tbody>${
    sessions.map(p => `<tr><td>${esc(when(p.updatedAt))}</td><td>${esc(p.name)}</td><td class="num">${num(p.age)}</td><td class="num">${num(Object.keys(p.results || {}).length)}</td>${ACTS.map(a => { const r = (p.results || {})[a.id]; return `<td class="num">${r ? num(r.pct) + "%" : "–"}</td>`; }).join("")}</tr>`).join("")}</tbody></table>`
    : `<div class="empty">${esc(t("noSessions"))}</div>`;
}
$("#teacherBtn").onclick = openTeacher;
$("#tClear").onclick = () => { $("#tClearConfirm").hidden = false; };
$("#tClearNo").onclick = () => { $("#tClearConfirm").hidden = true; };
$("#tClearYes").onclick = () => { store.set("sessions", {}); store.set("leads", []); store.set("player", null); player = null; $("#tClearConfirm").hidden = true; openTeacher(); };

/* ---------- Start ---------- */
renderHome();
sampleP = (async () => { try { return window.claude?.use ? await window.claude.use("sample") : null; } catch { return null; } })();
(async () => {
  try {
    if (!window.claude?.use) return;
    const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    isOwner = (u ? await u.canEdit() : false) || false;
    db = d;
    if (db && player) savePlayer();
    if (!$("#viewTeacher").hidden) openTeacher();
  } catch {}
})();
})();
